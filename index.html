  search:d=>go("addsupplier",{id:d.id,q:val("s-q")}),
  invite:d=>{invite(d.id,d.cvr,val("s-contact"),val("s-email"));go("project",{id:d.id,tab:"kaede"});toast("Invitationen er sendt. Invitationsmailen ligger i test-mailboxen.")},
  resend:d=>{resend(d.id);$("dlg").close();toast("Invitationen er sendt igen — samme relation, ingen dublet.")},cancelinv:d=>{cancelInv(d.id);$("dlg").close();toast("Invitationen er annulleret.")},
  endrel:d=>{endRel(d.id,val("end-date"),"");$("dlg").close();toast("Underleverandøren er afsluttet. Historikken er bevaret.")},
  node:d=>nodeDialog(d.p,d.key,d.rel),
  claim:d=>{claim(d.id);toast("Virksomheden er oprettet.")},pay:()=>{pay();toast("Abonnementet er aktiveret (simuleret — ingen betaling er gennemført).")},paysettings:()=>{pay();toast("Abonnementet er aktiveret (simuleret — ingen betaling er gennemført).")},
  accept:d=>{if(!chk("a-ok"))stop("Sæt flueben for at acceptere.");accept(d.id);go("onboarding",{id:d.id})},
  mode:d=>{const m=document.querySelector('input[name="mode"]:checked');if(!m)stop("Vælg, hvem der udfører arbejdet.");workMode(d.id,m.value);const r=S.rels.find(x=>x.id===d.id);m.value==="SUBS"?go("addsupplier",{id:r.project}):go("employees",{id:r.project,next:m.value==="BOTH"?"sub":""})},
  regemps:d=>{regEmps(d.id,[0,1,2,3].map(i=>({name:val("e-n"+i),role:val("e-r"+i),start:val("e-s"+i)})),chk("e-ok"));toast("Medarbejderne er registreret med tidsstempel.");d.next==="sub"?go("addsupplier",{id:d.id}):go("project",{id:d.id,tab:"medarbejdere"})},
  upload:d=>{const f=$("u-file").files[0];const doc=upload(d.id,val("u-ym"),f?f.name:"",chk("u-ok"));go("project",{id:d.id,tab:"eindkomst"});toast(`eIndkomst for ${ymLabel(doc.ym)} er registreret som v${doc.versions.length}.${doc.versions.length>1?" Tidligere versioner er bevaret.":""}`)},
  openfile:d=>toast(me().sens?"Åbner “"+d.f+"” via kortlivet, brugerbundet link (simuleret).":"Du har ikke adgang til dette dokument."),
  complete:d=>{complete(d.id,chk("c-ok"));go("project",{id:d.id});toast("Projektet er afsluttet. Det afsluttende snapshot er oprettet.")},
  report:d=>{validatePeriod(proj(d.id),val("r-from"),val("r-to"));const r=makeReport(d.id,val("r-from"),val("r-to"));go("report",{id:r.id})},
  review:d=>{review(d.id);toast("Markeret som gennemgået. Hændelsen er bevaret i historikken.")},readall:()=>myNotifs().forEach(n=>n.read=true),
  applyhe:()=>{applyHe(val("he-msg"));toast("Ansøgningen er sendt. Log ind som admin@complychain.dk for at behandle den.")},
  he:d=>{decideHe(d.cvr,d.to);toast("Beslutningen er registreret og auditeret.")},
  job:d=>{d.job==="daily"?runDaily(true):d.job==="monthly"?runMonthly(val("m-ym")):runDocs();toast(S.jobs[0].job+": "+S.jobs[0].res)},
};
const pf=()=>({name:val("p-name"),ref:val("p-ref"),start:val("p-start"),end:val("p-end"),address:val("p-address"),city:val("p-city"),client:val("p-client"),showClient:chk("p-show")});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"),a=e.target.closest("[data-act]");
  try{if(a){ACTS[a.dataset.act](a.dataset);if(!["node","menu","close","print","openfile","reset"].includes(a.dataset.act)&&S.view)render()}else if(g){const d=g.dataset;go(d.go,{id:d.id,tab:d.tab,cvr:d.cvr,ym:d.ym,all:d.all,next:d.next,q:d.q})}}
  catch(err){if(err instanceof Stop)toast(err.message);else{console.error(err);toast("Der opstod en uventet fejl.")}}});
document.addEventListener("change",e=>{const t=e.target;if(false){}
  else if(t.dataset.reg){const g=S.registry[t.dataset.reg];g[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;save();toast(t.dataset.f==="status"?"Det simulerede register er ændret. Kundernes visning opdateres først, når “Kør daglig selskabsstatus” (eller “Næste dag”) kører.":t.dataset.f==="fail"?"Udfald er "+(t.checked?"slået til":"slået fra")+" i det simulerede register.":"Det simulerede register er ændret. Moms/arbejdsgiver slår først igennem ved næste månedlige snapshot.");render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="s-q"){e.preventDefault();document.querySelector('[data-act="search"]').click()}});
if(!load())fresh();if(!S.userInvites)S.userInvites=[];
</script>
<style>
#app.nocomp{grid-template-columns:minmax(0,1fr)}#app.auth{display:block}#app.auth aside,#app.auth main{display:none}
.authwrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.authside{background:var(--side);color:var(--sideText);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.authside h2{font-size:30px;line-height:1.25;color:#fff;font-weight:600}.authside li{margin:10px 0}.authside ul{padding-left:18px;margin:0}
.authmain{display:flex;align-items:center;justify-content:center;padding:32px 16px}.authbox{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.demo{display:flex;flex-direction:column;gap:6px}.demo button{text-align:left;white-space:normal;font-weight:400}.demo b{font-weight:600}
@media (max-width:860px){.authwrap{grid-template-columns:minmax(0,1fr)}.authside{padding:24px}.authside ul{display:none}.authside h2{font-size:22px}}
</style>
<script>
"use strict";
/* ---------------- Login-flader ---------------- */
function renderAuth(){
  $("app").classList.add("auth");const v=S.view;let box="";
  const back=`<p class="sub" style="text-align:center"><button class="lnk" data-go="login">Tilbage til log ind</button></p>`;
  if(v.name==="login"){const demo=[["niels@nordisk-entreprise.dk","HE — Nordisk Entreprise A/S","ser hele kæden"],["mads@ventfix.dk","Underleverandør — VentFix ApS",""],["peter@danskklimaservice.dk","Underleverandør — Dansk Klima Service ApS",""],["lise@teknikpartner.dk","Underleverandør — Teknik Partner ApS","3. led — ser “Skjult virksomhed”"],["rikke@renservice.dk","Tidligere underleverandør — Ren Service Danmark ApS","relation afsluttet 10.09.2026"],["karen@sjaellandbyg.dk","HE-ansøger — Sjælland Byg & Anlæg A/S","afventer godkendelse"],["admin@complychain.dk","Intern ComplyChain-admin","godkender HE, simulerer register"]];
    box=`<h1>Log ind</h1><p class="sub">Velkommen tilbage til ComplyChain.</p>${v.msg?`<div class="note" style="background:var(--accSoft);color:var(--acc)">${esc(v.msg)}</div>`:""}
    <div class="f"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username" value="${esc(v.email||"")}"></div><div class="f"><label for="l-pw">Adgangskode</label><input id="l-pw" type="password" autocomplete="current-password"></div>
    <div class="row" style="justify-content:flex-end"><button class="lnk" data-go="forgot">Glemt adgangskode?</button></div><button class="pri" data-act="login" style="padding:12px">Log ind</button>
    <p class="sub" style="text-align:center">Har du ikke en konto? <button class="lnk" data-go="register">Opret konto</button></p>
    <div class="card"><h3>Demobrugere — adgangskode ${DEMO_PW}</h3><div class="demo">${demo.map(([e,t,n])=>`<button data-act="demologin" data-email="${e}"><b>${t}</b><br><span class="sub">${e}${n?" · "+n:""}</span></button>`).join("")}</div></div>
    <div class="row" style="justify-content:center"><button class="sm" data-go="mailbox">✉ Test-mailbox</button><button class="sm" data-act="reset">Nulstil testdata</button></div>`}
  else if(v.name==="register")box=`<h1>Opret konto</h1><p class="sub">Din konto er personlig. Du tilknytter din virksomhed i næste trin.</p><div class="f"><label for="r-name">Fulde navn</label><input id="r-name" autocomplete="name"></div><div class="f"><label for="r-email">Arbejds-e-mail</label><input id="r-email" type="email" value="${esc(v.email||"")}"></div><div class="f"><label for="r-pw">Adgangskode</label><input id="r-pw" type="password" autocomplete="new-password"><span class="sub">Mindst 10 tegn.</span></div><button class="pri" data-act="register" style="padding:12px">Opret konto</button><p class="sub" style="text-align:center">Har du allerede en konto? <button class="lnk" data-go="login">Log ind</button></p>`;
  else if(v.name==="checkmail")box=`<h1>Tjek din indbakke</h1><p class="sub">Vi har sendt et bekræftelseslink til <b>${esc(v.email||"")}</b>. I testversionen ligger e-mailen i test-mailboxen.</p><button class="pri" data-go="mailbox" style="padding:12px">Åbn test-mailbox</button>${back}`;
  else if(v.name==="forgot")box=v.sent?`<h1>Tjek din indbakke</h1><p class="sub">Hvis adressen findes hos os, har vi sendt en e-mail med et link til at vælge en ny adgangskode.</p><button class="pri" data-go="mailbox" style="padding:12px">Åbn test-mailbox</button>${back}`:`<h1>Glemt adgangskode</h1><p class="sub">Indtast din e-mail, så sender vi et link til at vælge en ny adgangskode.</p><div class="f"><label for="f-email">E-mail</label><input id="f-email" type="email"></div><button class="pri" data-act="forgot" style="padding:12px">Send link</button>${back}`;
  else if(v.name==="reset")box=`<h1>Vælg ny adgangskode</h1><div class="f"><label for="n-pw">Ny adgangskode</label><input id="n-pw" type="password" autocomplete="new-password"><span class="sub">Mindst 10 tegn.</span></div><button class="pri" data-act="resetpw" data-code="${esc(v.code||"")}" style="padding:12px">Gem adgangskode</button>${back}`;
  else box=`<div class="row" style="justify-content:space-between"><h1>Test-mailbox</h1><button class="sm" data-go="login">Til log ind</button></div>${mailList()}`;
  $("view").innerHTML="";$("view").style.display="none";$("top").innerHTML="";$("side").innerHTML="";
  let a=$("authroot");if(!a){a=document.createElement("div");a.id="authroot";$("app").appendChild(a)}a.hidden=false;
  a.innerHTML=`<div class="authwrap"><div class="authside"><div class="logo" style="padding:0"><i>⛓</i>ComplyChain</div><div><h2>Sikker dokumentation.<br>Stærkere samarbejde.</h2><p style="margin-top:12px">Registrér først. Dokumentér løbende. Glem aldrig historikken.</p><ul style="margin-top:24px"><li>Hele leverandørkæden samlet ét sted — led for led.</li><li>Automatisk kontrol af offentlige registre, dagligt og månedligt.</li><li>Tidsstemplet historik, der ikke kan omskrives.</li></ul></div><small>Testversion 4 · alt kører lokalt i browseren</small></div><div class="authmain"><div class="authbox">${box}</div></div></div>`;save();
}
const _render=render;render=function(){const a=$("authroot");if(me()){if(a)a.hidden=true;$("view").style.display=""}_render()};
function mailList(all){const mine=m=>me()&&(m.to===me().email||(myCvr()&&(m.from===myCvr()||S.people.some(p=>p.cvr===myCvr()&&p.email===m.to))));const showAll=all||!me()||isAdmin();const ms=S.mails.filter(m=>showAll||mine(m));return`<p class="sub">E-mails sendes ikke ud i testversionen — de lander her (simuleret mailserver). Klik på linket i en e-mail for at fortsætte flowet.</p>${me()&&!isAdmin()?`<div class="row">${showAll?pill("a","⚠ Testfunktion: viser ALLE udgående e-mails — også andre virksomheders"):pill("","Viser kun e-mails til eller fra jeres virksomhed")} <button class="sm" data-go="mailbox" data-all="${showAll?"":"1"}">${showAll?"Vis kun vores":"Vis alle (testfunktion)"}</button></div>`:""}<div class="card flush">${ms.slice(0,60).map(m=>`<div class="li"><div><b>${esc(m.subject)}</b><small>Til: ${esc(m.to)} · ${dts(m.t)}</small><small style="white-space:pre-wrap">${esc(m.text)}</small></div>${m.link?`<button class="sm pri" data-act="maillink" data-mail="${m.id}">${esc(m.link.label)}</button>`:""}</div>`).join("")||`<p class="sub" style="padding:20px">Ingen e-mails endnu.</p>`}</div>`}
VIEWS.mailbox=v=>head("Test-mailbox","Udgående e-mails i testversionen. Én statusændring giver én e-mail pr. modtager.")+mailList(!!v.all);

/* ---------------- Tilknyt virksomhed (efter første login) ---------------- */
VIEWS.company=v=>{const ui=myUserInvite();const q=(v.q||"").trim().toLowerCase();const res=q.length>1?Object.entries(S.registry).filter(([c,g])=>c===q||g.name.toLowerCase().includes(q)):[];const g=v.cvr&&S.registry[v.cvr];
  return`<div style="max-width:680px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px">`+pendingInvites()
  +(ui?`<div class="card" style="border-color:var(--acc)"><h3>Brugerinvitation</h3><h2>Du er inviteret til ${esc(co(ui.cvr).name)}</h2><p class="sub">Rolle: ${esc(ui.role)} · inviteret af ${esc(ui.by)}</p><div><button class="pri" data-act="join">Acceptér invitation</button></div></div>`:"")
  +`<div class="card"><h1>Find din virksomhed</h1><p class="sub">Søg på CVR-nummer eller virksomhedsnavn. Vi henter de offentlige oplysninger automatisk.</p><div class="row"><input id="c-q" style="flex:1" placeholder="CVR-nummer eller virksomhedsnavn" value="${esc(v.q||"")}"><button data-act="cosearch">Søg</button></div><p class="sub">Testregister: ${Object.entries(S.registry).map(([c,x])=>`${esc(x.name)} (${c})`).join(" · ")}</p>${res.map(([c,x])=>`<div class="li"><div><b>${esc(x.name)}</b><small>CVR ${c} · ${esc(x.city)}</small></div><button class="sm" data-go="company" data-cvr="${c}">Vælg</button></div>`).join("")}</div>`
  +(g?`<div class="card"><h2>${esc(g.name)}</h2><p class="sub">CVR ${v.cvr} · ${esc(g.industry)} · ${esc(g.city)}</p><div>${stPill(g.status)}</div><p class="note" style="background:var(--soft);color:var(--ink)">Du bliver virksomhedens første <b>Ejer/Administrator</b> og kan derefter invitere kolleger. Bekræft kun, hvis du handler på vegne af virksomheden.</p><div><button class="pri" data-act="createco" data-cvr="${v.cvr}">Bekræft og opret</button></div></div>`:"")+`</div>`};

/* ---------------- Indstillinger: brugere & sikkerhed ---------------- */
const _settings=VIEWS.settings;
VIEWS.settings=()=>{const cvr=myCvr(),owner=me().role==="Ejer / Administrator";const us=S.people.filter(p=>p.cvr===cvr);const inv=S.userInvites.filter(i=>i.cvr===cvr&&!i.done);
  return _settings()+`<div class="card flush"><div class="ch head"><div><h2>Brugere & roller — ${us.length+inv.length}/${SEATS}</h2><p class="sub">Hver bruger har sin egen personlige konto, så historikken viser, hvem der gjorde hvad.</p></div></div><div class="tw"><table><tr><th>Bruger</th><th>Rolle</th><th>Følsomme dokumenter</th></tr>${us.map(u=>`<tr><td><b>${esc(u.name)}</b><small>${esc(u.email)}</small></td><td>${esc(u.role)}</td><td>${u.sens?pill("g","✓ Har adgang"):pill("","Kun status")}</td></tr>`).join("")}${inv.map(i=>`<tr><td>${esc(i.email)}<small>Invitation afventer</small></td><td>${esc(i.role)}</td><td>${i.sens?pill("g","✓ Har adgang"):pill("","Kun status")}</td></tr>`).join("")}</table></div>
  ${owner?`<div class="ch" style="border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px"><h3>Invitér bruger</h3><div class="grid g2"><div class="f"><label for="iu-email">E-mail</label><input id="iu-email" type="email"></div><div class="f"><label for="iu-role">Rolle</label><select id="iu-role"><option>Manager</option><option>Projektleder</option><option>Læseadgang</option><option>Ejer / Administrator</option></select></div></div><label class="chk"><input type="checkbox" id="iu-sens"><span><b>Adgang til følsomme dokumenter</b><br><span class="sub">Særskilt rettighed. Uden den kan brugeren se, at eIndkomst er uploadet — men ikke åbne filen.</span></span></label><div><button class="pri" data-act="inviteuser">Send invitation</button></div></div>`:""}</div>
  <div class="card"><h2>Skift adgangskode</h2><div class="grid g2"><div class="f"><label for="cp-cur">Nuværende adgangskode</label><input id="cp-cur" type="password" autocomplete="current-password"></div><div class="f"><label for="cp-new">Ny adgangskode</label><input id="cp-new" type="password" autocomplete="new-password"></div></div><div><button data-act="changepw">Skift adgangskode</button></div></div>`};

Object.assign(ACTS,{
  login:()=>{login(val("l-email"),$("l-pw").value);const r=!myCvr()&&!isAdmin()&&S.rels.find(x=>x.email===me().email&&x.status==="INVITED");S.view=r?{name:"invitation",id:r.id}:{name:home()}},
  demologin:d=>{login(d.email,DEMO_PW);S.view={name:home()}},
  register:()=>{const e=val("r-email");register(val("r-name"),e,$("r-pw").value);S.view={name:"checkmail",email:e}},
  forgot:()=>{forgot(val("f-email"));S.view={name:"forgot",sent:true}},
  resetpw:d=>{resetPw(d.code,$("n-pw").value);S.view={name:"login",msg:"Din adgangskode er ændret. Log ind med den nye adgangskode."}},
  changepw:()=>{changePw($("cp-cur").value,$("cp-new").value);toast("Adgangskoden er ændret.")},
  maillink:d=>{const m=S.mails.find(x=>x.id===d.mail),l=m.link;
    if(l.kind==="verify"){const p=verify(l.code);S.me=null;S.view={name:"login",email:p.email,msg:"Din e-mailadresse er bekræftet. Du kan nu logge ind."}}
    else if(l.kind==="reset"){S.me=null;S.view={name:"reset",code:l.code}}
    else{const has=S.people.some(p=>p.email===l.email);if(me()&&me().email===l.email)S.view=l.kind==="inv"?{name:"invitation",id:l.rel}:{name:"company"};else{S.me=null;S.view=has?{name:"login",email:l.email,msg:"Log ind for at åbne invitationen."}:{name:"register",email:l.email}}}},
  cosearch:()=>{S.view={name:"company",q:val("c-q")}},
  createco:d=>{createCompany(d.cvr);S.view={name:"dashboard"};toast("Virksomheden er oprettet. Du er Ejer/Administrator.")},
  join:()=>{joinCompany();S.view={name:"dashboard"};toast("Du er nu tilknyttet virksomheden.")},
  inviteuser:()=>{inviteUser(val("iu-email"),val("iu-role"),chk("iu-sens"));toast("Invitationen er sendt — se test-mailboxen.")},
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const m={"l-pw":"login","l-email":"login","r-pw":"register","f-email":"forgot","n-pw":"resetpw","c-q":"cosearch"}[e.target.id];if(m){e.preventDefault();document.querySelector(`[data-act="${m}"]`).click()}});
render();
</script>
