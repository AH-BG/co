const ym=d=>d.slice(0,7);const ymLabel=k=>{const[y,m]=k.split("-");const n=MONTHS[+m-1];return n[0].toUpperCase()+n.slice(1)+" "+y};

function vis(p,viewer){
  const edges=S.rels.filter(r=>r.project===p.id&&r.status!=="CANCELLED");const acc=e=>e.status==="ACTIVE"||e.status==="ENDED";

  const anc=new Set(),us=[...direct];while(us.length){const c=us.pop();if(anc.has(c))continue;anc.add(c);edges.filter(e=>acc(e)&&e.down===c).forEach(e=>us.push(e.up))}

  const leaves=edges.filter(e=>e.status==="INVITED"&&desc.has(e.up));const masked=leaves.filter(e=>hidden.has(e.down));const open=leaves.filter(e=>!hidden.has(e.down));
  const identity=new Set([...base,...open.map(e=>e.down)]);
  const full=[...edges.filter(e=>acc(e)&&desc.has(e.up)&&desc.has(e.down)),...open];
  const path=edges.filter(e=>acc(e)&&!desc.has(e.up)&&anc.has(e.up)&&(anc.has(e.down)||e.down===viewer));
  return{isHE:false,identity,detail:desc,hidden,full,path,masked,participates:myUp.length>0}

/** Den ENESTE kædeprojektion brugerfladen tegner fra. Skjulte noder har hverken navn, CVR eller id. */
function chainView(p,viewer){
  const v=vis(p,viewer),hk=new Map();const key=c=>v.hidden.has(c)?(hk.has(c)?hk.get(c):(hk.set(c,"hidden-"+(hk.size+1)),hk.get(c))):c;
  const shown=new Set([p.he]);[...v.full,...v.path].forEach(e=>{shown.add(e.up);shown.add(e.down)});
  const nodes=[...shown].map(c=>v.hidden.has(c)?{key:key(c),kind:"HIDDEN"}:{key:c,kind:c===p.he?"HE":"CO",cvr:c,name:co(c).name,self:c===viewer,detail:v.detail.has(c)});
  const links=[...v.full.map(e=>({from:key(e.up),to:key(e.down),rel:e.id,status:e.status,own:e.up===viewer,end:e.end})),...v.path.map(e=>({from:key(e.up),to:key(e.down),status:e.down===viewer?e.status:undefined,rel:e.down===viewer?e.id:undefined,end:e.down===viewer?e.end:undefined}))];
  v.masked.forEach(e=>{nodes.push({key:"inv-"+e.id,kind:"CO",name:co(e.down).name,cvr:e.down,leafOnly:true});links.push({from:key(e.up),to:"inv-"+e.id,rel:e.id,status:e.status,own:e.up===viewer})});
  let root=p.he;if(p.client&&p.showClient){nodes.unshift({key:"client",kind:"CLIENT",name:p.client});links.unshift({from:"client",to:p.he});root="client"}

function cycle(p,up,down){if(up===down)return true;const e=S.rels.filter(r=>r.project===p.id&&(r.status==="ACTIVE"||r.status==="ENDED"));const seen=new Set(),st=[down];while(st.length){const c=st.pop();if(c===up)return true;if(seen.has(c))continue;seen.add(c);e.filter(x=>x.up===c).forEach(x=>st.push(x.down))}return false}
function observers(p,subject){const e=S.rels.filter(r=>r.project===p.id&&r.status==="ACTIVE");const out=new Set(),st=e.filter(x=>x.down===subject).map(x=>x.up);while(st.length){const c=st.pop();if(out.has(c))continue;out.add(c);e.filter(x=>x.down===c).forEach(x=>st.push(x.up))}if(out.size)out.add(p.he);out.delete(subject);return out}
function myProjects(cvr){return S.projects.filter(p=>p.he===cvr||(p.status!=="DRAFT"&&S.rels.some(r=>r.project===p.id&&r.down===cvr&&(r.status==="ACTIVE"||r.status==="ENDED"))))}

const relLive=r=>r.status==="ACTIVE"||(r.status==="ENDED"&&r.end>=S.today);
function participating(p,cvr){return p.he===cvr||S.rels.some(r=>r.project===p.id&&r.down===cvr&&relLive(r))}
/* Projektstatus set fra virksomheden: HE ser projektets egen status; en underleverandør ser sin egen deltagelse. */
function viewStatus(p,cvr){if(p.he===cvr||p.status!=="ACTIVE")return p.status;return participating(p,cvr)?"ACTIVE":"PARTICIPATION_ENDED"}
function participationEnd(p,cvr){return S.rels.filter(r=>r.project===p.id&&r.down===cvr&&r.status==="ENDED").reduce((m,r)=>r.end>m?r.end:m,"")}
/* Kan virksomheden redigere på projektet? Kontrolleres ALTID også i motoren (invite/regEmps/endRel) — ikke kun i UI. */

  const p={id:uid(),he:myCvr(),name:f.name,ref:f.ref||"",start:f.start,end:f.end||"",address:f.address,city:f.city||"",desc:f.desc||"",client:f.client||"",showClient:!!f.showClient,status:"DRAFT"};S.projects.push(p);log("PROJECT_CREATED",{co:p.he},p.id);if(activate)activate_(p);return p}

function invite(pid,cvr,contact,email){needWrite();email=String(email||'').trim().toLowerCase();const p=proj(pid);if(!canSee(p))stop("Ikke fundet.");openP(p);const up=myCvr();cvr=String(cvr).replace(/\s/g,"");

function resend(id){const r=S.rels.find(x=>x.id===id&&x.up===myCvr());if(!r||r.status!=="INVITED")stop("Invitationen er ikke længere åben.");log("RESENT",{co:r.down},r.project);mail(r.email,"Påmindelse: projektinvitation","Invitationen er sendt igen. Samme relation — ingen dublet.",{label:"Åbn invitation",kind:"inv",rel:r.id,email:r.email},null,r.up)}
function cancelInv(id){const r=S.rels.find(x=>x.id===id&&x.up===myCvr());if(!r||r.status!=="INVITED")stop("Kun ubesvarede invitationer kan annulleres. En accepteret relation afsluttes i stedet.");r.status="CANCELLED";closeAct("inv:"+id,"CANCELLED");closeAct("acc:"+id,"CANCELLED");log("INV_CANCELLED",{co:r.down},r.project)}

function claim(relId){const r=myInvite(relId);if(!r)stop("Invitationen findes ikke.");const c=co(r.down);if(myCvr()===r.down)return;if(c.workspace)stop(c.name+" er allerede oprettet i ComplyChain. Bed en administrator i virksomheden om at invitere dig som bruger.");me().cvr=r.down;me().role="Ejer / Administrator";me().sens=true;workspace(r.down)}
function pay(){const c=co(myCvr());if(c.sub==="ACTIVE")return false;c.sub="ACTIVE";c.subSince=S.today;closeAct("pay:"+c.cvr,"COMPLETED");log("SUBSCRIPTION",{co:c.cvr});return true}
function accept(relId){const r=S.rels.find(x=>x.id===relId&&x.down===myCvr());if(!r)stop("Ikke fundet.");if(r.status==="ACTIVE")return;if(r.status!=="INVITED")stop("Invitationen er annulleret.");

/* ---------- eIndkomst: månedlig, egen upload, versioner bevares ---------- */
/* Alle kalendermåneder, hvor virksomheden deltog (inkl. igangværende). */
function months(pid,cvr){const p=proj(pid);const out=new Set();S.rels.filter(r=>r.project===pid&&r.down===cvr&&r.acceptedAt).forEach(r=>{let k=ym(r.acceptedAt);const last=ym(r.end||p.completedAt||S.today);while(k<=last){out.add(k);k=nextYm(k)}});return[...out].sort()}
/* Måneder der kan dokumenteres: kun AFSLUTTEDE kalendermåneder. Den igangværende måned åbnes først efter månedsskifte. */
const closedMonth=k=>k<ym(S.today);
const uploadable=(pid,cvr)=>months(pid,cvr).filter(closedMonth);
function period(pid,cvr,k){let d=S.docs.find(x=>x.project===pid&&x.cvr===cvr&&x.ym===k);if(!d){d={id:uid(),project:pid,cvr,ym:k,status:"PENDING",due:nextYm(k)+"-"+DUE_DAY,versions:[]};S.docs.push(d)}return d}
function upload(pid,k,file,confirmed){needWrite();const p=proj(pid);if(!canSee(p))stop("Ikke fundet.");if(p.he===myCvr())stop("eIndkomst uploades af den enkelte underleverandør selv.");if(!k)stop("Vælg en dokumentationsmåned.");if(!months(pid,myCvr()).includes(k))stop("Måneden ligger uden for jeres deltagelse på projektet.");if(!closedMonth(k))stop(`${ymLabel(k)} er ikke afsluttet endnu. eIndkomst dokumenteres pr. afsluttet kalendermåned.`);if(!file)stop("Vælg en fil.");if(!/\.(pdf|csv|xlsx|xml)$/i.test(file))stop("Filtypen understøttes ikke. Tilladte formater: PDF, CSV, XLSX, XML.");if(!confirmed)stop("Bekræft erklæringen for at fortsætte.");
  const d=period(pid,myCvr(),k);const at=stamp();d.versions.push({no:d.versions.length+1,file,at,by:me().name});d.status="UPLOADED";log(d.versions.length===1?"EINDKOMST":"EINDKOMST_VERSION",{co:myCvr(),ym:k,no:d.versions.length},pid,null,at);closeAct("doc:"+d.id,"COMPLETED");observers(p,myCvr()).forEach(o=>notify(o,"EINDKOMST_UPLOADED",[pid],myCvr(),{ym:k,no:d.versions.length},false,at));return d}
function runDocs(){let n=0;S.projects.filter(p=>p.status!=="DRAFT").forEach(p=>{[...new Set(S.rels.filter(r=>r.project===p.id&&r.acceptedAt).map(r=>r.down))].forEach(c=>{const rs=S.rels.filter(r=>r.project===p.id&&r.down===c&&r.acceptedAt);if(rs.every(r=>r.mode==="SUBS"))return;months(p.id,c).filter(k=>k<ym(S.today)).forEach(k=>{if(!S.docs.some(d=>d.project===p.id&&d.cvr===c&&d.ym===k)){const d=period(p.id,c,k);n++;act("EINDKOMST_PENDING",c,[p.id],c,{ym:k},"doc:"+d.id);notify(c,"EINDKOMST_REQUIRED",[p.id],c,{ym:k},true)}})})});
  S.docs.filter(d=>d.status==="PENDING"&&d.due<S.today).forEach(d=>{d.status="MISSING";notify(d.cvr,"EINDKOMST_REMINDER",[d.project],d.cvr,{ym:d.ym},true)});S.jobs.unshift({t:stamp(),job:"eIndkomst-perioder",res:n+" nye perioder"})}

/* ---------- Register: DAGLIGT = kun selskabsstatus. MÅNEDLIGT = status + moms + arbejdsgiver. ---------- */
function monitored(){return[...new Set(S.rels.filter(r=>r.status==="ACTIVE"&&proj(r.project).status==="ACTIVE").map(r=>r.down))]}
function observe(cvr,by){const c=co(cvr),g=S.registry[cvr];if(c.cur&&c.cur!==g.status)statusEvent(cvr,"STATUS",c.cur,g.status,by);c.cur=g.status}
function runDaily(manual){let ch=0,fail=0;monitored().forEach(cvr=>{const c=co(cvr),g=S.registry[cvr];if(!manual&&c.lastDaily===S.today&&c.lastOutcome==="OK")return;c.lastDaily=S.today;S.checks.push({cvr,t:stamp(),type:"SELSKABSSTATUS",ok:!g.fail});if(g.fail){c.lastOutcome="COULD_NOT_CHECK";fail++;return}c.lastOutcome="OK";const b=S.events.length;observe(cvr,"DAGLIG");if(S.events.length>b)ch++});S.jobs.unshift({t:stamp(),job:"Daglig selskabsstatus",res:`${monitored().length} CVR · ${ch} ændret · ${fail} kunne ikke kontrolleres`})}
function snapshot(cvr,type,pid,k){const g=S.registry[cvr],c=co(cvr);const s={id:uid(),cvr,type,project:pid,ym:k||null,t:stamp(),status:g.fail?"COULD_NOT_CHECK":g.status,vat:g.fail?"COULD_NOT_CHECK":g.vat?"REGISTERED":"NOT_REGISTERED",emp:g.fail?"COULD_NOT_CHECK":g.emp?"REGISTERED":"NOT_REGISTERED"};S.snaps.push(s);
  if(!g.fail){const newest=type!=="MONTHLY"||!S.snaps.some(x=>x.cvr===cvr&&x.type==="MONTHLY"&&x.ym>k&&x.status!=="COULD_NOT_CHECK");
    if(newest){observe(cvr,type==="MONTHLY"?"MÅNEDLIG":"SNAPSHOT");if(type==="MONTHLY"){const prev=S.snaps.filter(x=>x.cvr===cvr&&x.type==="MONTHLY"&&x.ym<k&&x.vat!=="COULD_NOT_CHECK").sort((a,b)=>a.ym.localeCompare(b.ym)).pop();if(prev){if(prev.vat!==s.vat)statusEvent(cvr,"VAT",prev.vat,s.vat,"MÅNEDLIG");if(prev.emp!==s.emp)statusEvent(cvr,"EMPLOYER",prev.emp,s.emp,"MÅNEDLIG")}}c.vat=s.vat;c.emp=s.emp}
    else s.backdated=true; /* efterbehandlet ældre periode: ændrer aldrig den aktuelle kundevisning eller nyere måneder */ }return s}
/* Seneste RELEVANTE månedlige snapshot = højeste måned, ikke senest oprettede række. */
const latestMonthly=cvr=>S.snaps.filter(x=>x.cvr===cvr&&x.type==="MONTHLY").sort((a,b)=>a.ym.localeCompare(b.ym)||(a.seq||0)-(b.seq||0)).pop();
const lastDayOf=d=>{const x=new Date(d+"T12:00:00Z");x.setUTCMonth(x.getUTCMonth()+1,0);return x.toISOString().slice(0,10)};
const prevYm=k=>{let[y,m]=k.split("-").map(Number);m--;if(m<1){m=12;y--}return y+"-"+String(m).padStart(2,"0")};
/* Måneder der må slutbehandles: afsluttede måneder — samt indeværende måned på dens sidste dag. Standard = seneste tilladte måned. */
const monthlyAllowed=k=>k<ym(S.today)||(k===ym(S.today)&&S.today===lastDayOf(S.today));
const monthlyDefault=()=>monthlyAllowed(ym(S.today))?ym(S.today):prevYm(ym(S.today));
/* Regel for gentagen kørsel: ét gyldigt månedligt snapshot pr. virksomhed pr. måned. Findes det, bevares det uændret (ingen ny version);
   kun virksomheder uden gyldigt snapshot (fx efter “kunne ikke kontrolleres”) behandles. */
function runMonthly(k){k=k||monthlyDefault();if(!/^\d{4}-\d{2}$/.test(k))stop("Vælg en måned.");if(!monthlyAllowed(k))stop(`${ymLabel(k)} er ikke afsluttet endnu. Månedligt snapshot kan først tages på månedens sidste dag eller senere.`);
  const first=k+"-01",last=lastDayOf(first);const reasons=[];let n=0,kept=0;
  /* Grundlag for en (bagudrettet) månedskørsel pr. virksomhed: (a) en accepteret relation, der var gældende i måneden, og
     (b) mindst én registreret registerobservation (daglig kontrol eller snapshot) fra måneden. Uden begge dele kan et snapshot
     ikke fremstilles som en kontrol fra den periode — nutidige registerværdier må ikke stemples med en gammel måned. */
  const candidates=[...new Set(S.rels.filter(r=>r.acceptedAt&&r.status!=="CANCELLED"&&proj(r.project).status!=="DRAFT").map(r=>r.down))];
  candidates.forEach(cvr=>{const c=co(cvr);const ex=S.snaps.find(x=>x.cvr===cvr&&x.type==="MONTHLY"&&x.ym===k&&x.status!=="COULD_NOT_CHECK");if(ex){kept++;return}
    const rel=S.rels.some(r=>r.down===cvr&&r.acceptedAt&&r.status!=="CANCELLED"&&r.acceptedAt.slice(0,10)<=last&&(!r.end||r.end>=first));
    const obs=S.checks.some(x=>x.cvr===cvr&&x.t.slice(0,7)===k)||S.snaps.some(x=>x.cvr===cvr&&x.t.slice(0,7)===k);
    if(!rel){reasons.push(`${c.name}: ingen gældende relation i ${ymLabel(k)}`);return}
    if(!obs){reasons.push(`${c.name}: ingen registerobservationer registreret i ${ymLabel(k)}`);return}
    snapshot(cvr,"MONTHLY",null,k);n++});
  if(!n&&!kept)stop(`${ymLabel(k)} kan ikke behandles: ${reasons.length?reasons.join(" · "):"ingen virksomheder med relation i måneden"}. Et snapshot kan kun tages på grundlag af relationer og registerdata fra selve perioden.`);
  S.jobs.unshift({t:stamp(),job:"Månedligt snapshot "+ymLabel(k),res:n+" nye snapshots"+(kept?` · ${kept} fandtes allerede og er bevaret uændret`:"")+(reasons.length?` · sprunget over: ${reasons.join("; ")}`:"")+(k<monthlyDefault()?" · efterbehandlet ældre periode":"")});return{k,n,kept,reasons}}
/** 1 ændring × 1 modtager-virksomhed = 1 handling + 1 notifikation — uanset antal berørte projekter. Kun opstrøms led + HE får besked. */
function statusEvent(cvr,kind,prev,next,by){const ps=S.projects.filter(p=>p.status==="ACTIVE"&&S.rels.some(r=>r.project===p.id&&r.down===cvr&&r.status==="ACTIVE"));const ev={id:uid(),seq:S.seq++,cvr,kind,prev,next,t:stamp(),by,projects:ps.map(p=>p.id)};S.events.push(ev);
  const rec=new Map();ps.forEach(p=>{log("STATUS_"+kind,{co:cvr,prev,next},p.id,"system",ev.t);observers(p,cvr).forEach(o=>rec.set(o,[...(rec.get(o)||[]),p.id]))});
  rec.forEach((pids,o)=>{act("CHANGE_"+kind,o,pids,cvr,{prev,next,t:ev.t,ev:ev.id},"ev:"+ev.id+":"+o,ev.t);notify(o,"CHANGE_"+kind,pids,cvr,{prev,next},true,ev.t)})}
function act(type,owner,pids,subject,d,key,t){if(S.actions.some(a=>a.key===key))return;t=t||stamp();S.actions.push({id:uid(),seq:S.seq++,key,type,owner,projects:pids,subject,d,status:"OPEN",t});pids.forEach(pid=>log("ACTION_CREATED",{co:subject,owner,atype:type},pid,"system",t))}
function closeAct(key,status){S.actions.filter(a=>a.key===key&&a.status==="OPEN").forEach(a=>{a.status=status;a.closedAt=stamp()})}
function review(id){needWrite();const a=S.actions.find(x=>x.id===id&&x.owner===myCvr());if(!a)stop("Ikke fundet.");a.status="REVIEWED";a.closedAt=stamp();a.closedBy=me().name;a.projects.forEach(pid=>log("ACTION_REVIEWED",{co:a.subject,owner:a.owner,atype:a.type},pid))}
function notify(cvr,type,pids,subject,d,email,t){t=t||stamp();S.notifs.unshift({id:uid(),seq:S.seq++,to:cvr,type,projects:pids,subject,d,t,read:false});if(email){const who=S.people.find(p=>p.cvr===cvr);const n=pids.length;mail(who?who.email:co(cvr).name,notifTitle(type,d),type.startsWith("CHANGE_")?`${co(subject).name}\n${lab(d.prev)} → ${lab(d.next)}\n${n} ${n===1?"aktivt projekt":"aktive projekter"} berørt\n\nComplyChain dokumenterer den faktuelle ændring. Det er jeres virksomhed, der vurderer, om den giver anledning til handling.`:"Se detaljer i ComplyChain.",null,t)}}
const LAB={REGISTERED:"Registreret",NOT_REGISTERED:"Ikke registreret",COULD_NOT_CHECK:"Kunne ikke kontrolleres"};const lab=s=>LAB[s]||s;
function notifTitle(type,d){return({CHANGE_STATUS:"Virksomhedsstatus ændret",CHANGE_VAT:"Momsregistrering ændret",CHANGE_EMPLOYER:"Arbejdsgiverregistrering ændret",EINDKOMST_REQUIRED:"Upload eIndkomst — "+(d.ym?ymLabel(d.ym):""),EINDKOMST_REMINDER:"Påmindelse: eIndkomst mangler — "+(d.ym?ymLabel(d.ym):""),EINDKOMST_UPLOADED:"eIndkomst uploadet",SUPPLIER_ACCEPTED:"Invitation accepteret",HE_DECISION:"Opdatering af jeres HE-ansøgning"})[type]||type}

/* ---------- HE-adgang, afslutning, rapport ---------- */
function applyHe(msg){const c=co(myCvr());if(c.he==="PENDING"||c.he==="APPROVED")stop("Der findes allerede en ansøgning.");c.he="PENDING";c.heMsg=msg||"";c.heAt=stamp();log("HE_APPLIED",{co:c.cvr})}
function decideHe(cvr,to){if(!isAdmin())stop("Kun intern ComplyChain-admin.");const c=co(cvr);const prev=c.he;c.he=to;log("HE_"+to,{co:cvr,prev});notify(cvr,"HE_DECISION",[],cvr,{to},true)}
function complete(pid,confirmed){needWrite();const p=proj(pid);if(p.he!==myCvr())stop("Kun hovedentreprenøren kan afslutte projektet.");if(p.status==="COMPLETED")return;openP(p);if(!confirmed)stop("Bekræft, at projektet skal afsluttes.");
  [...new Set([p.he,...S.rels.filter(r=>r.project===pid&&r.acceptedAt).map(r=>r.down)])].forEach(c=>snapshot(c,"PROJECT_COMPLETION",pid));
  S.rels.filter(r=>r.project===pid&&r.status==="INVITED").forEach(r=>{r.status="CANCELLED";closeAct("inv:"+r.id,"CANCELLED");closeAct("acc:"+r.id,"CANCELLED")});
  p.status="COMPLETED";p.completedAt=S.today;p.finalSnapshot={t:stamp(),rels:JSON.parse(JSON.stringify(S.rels.filter(r=>r.project===pid))),docs:S.docs.filter(d=>d.project===pid).map(d=>({cvr:d.cvr,ym:d.ym,status:d.status}))};log("FINAL_SNAPSHOT",{co:p.he},pid);log("PROJECT_COMPLETED",{co:p.he},pid)}
function auditVisible(a,v,viewer){if(v.isHE)return true;if(["PROJECT_CREATED","PROJECT_ACTIVATED","PROJECT_COMPLETED","FINAL_SNAPSHOT"].includes(a.type))return true;if(a.type.startsWith("ACTION_"))return a.owner===viewer;if(!a.co||!v.detail.has(a.co))return false;return!a.actorCo||v.identity.has(a.actorCo)}
function describe(a){const by=a.actor?`${a.actor} på vegne af ${co(a.actorCo)?.name||"ComplyChain"}`:"systemet";const n=a.co?co(a.co)?.name:"";const d=a.d;return({PROJECT_CREATED:`Projektet blev oprettet af ${by}.`,PROJECT_ACTIVATED:`Projektet blev aktiveret af ${by}.`,INVITED:`${n} blev inviteret som underleverandør af ${by}.`,RESENT:`Invitationen til ${n} blev sendt igen af ${by}.`,INV_CANCELLED:`Invitationen til ${n} blev annulleret af ${by}.`,ACCEPTED:`Invitationen blev accepteret af ${by}.`,WORK_MODE:`${by} angav, hvem der udfører arbejdet.`,ENDED:`${n} blev afsluttet som underleverandør pr. ${dk(d.end)} af ${by}.`,EMPLOYEES:`${d.n} medarbejder(e) blev registreret og bekræftet af ${by}.`,EINDKOMST:`eIndkomst for ${d.ym?ymLabel(d.ym):""} (v1) blev uploadet af ${by}.`,EINDKOMST_VERSION:`Ny version af eIndkomst for ${d.ym?ymLabel(d.ym):""} (v${d.no}) blev uploadet af ${by}. Tidligere versioner er bevaret.`,STATUS_STATUS:`Virksomhedsstatus ændret for ${n}: ${d.prev} → ${d.next}.`,STATUS_VAT:`Momsregistrering ændret for ${n}: ${lab(d.prev)} → ${lab(d.next)}.`,STATUS_EMPLOYER:`Arbejdsgiverregistrering ændret for ${n}: ${lab(d.prev)} → ${lab(d.next)}.`,ACTION_CREATED:`Handling oprettet vedr. ${n}.`,ACTION_REVIEWED:`Handling vedr. ${n} blev markeret som gennemgået af ${by}. Hændelsen er bevaret.`,FINAL_SNAPSHOT:"Afsluttende, uforanderligt compliance-snapshot blev oprettet.",PROJECT_COMPLETED:`Projektet blev afsluttet af ${by}.`,REPORT:`Compliance Report blev genereret af ${by}.`,SUBSCRIPTION:`Underleverandør-abonnement aktiveret for ${n} (simuleret betaling).`,WORKSPACE:`${n} blev oprettet i ComplyChain af ${by}.`,HE_APPLIED:`${n} ansøgte om HE-adgang.`,HE_APPROVED:`HE-adgang godkendt for ${n}.`,HE_REJECTED:`HE-ansøgning afvist for ${n}.`,HE_SUSPENDED:`HE-adgang suspenderet for ${n}.`,USER_INVITED:`En bruger blev inviteret til ${n} af ${by}.`,USER_JOINED:`En bruger tilsluttede sig ${n}.`})[a.type]||a.type}

/* ---------- Login, konti, e-mailbekræftelse, nulstilling (simuleret e-mail via test-mailboxen) ---------- */
const normMail=e=>String(e||"").trim().toLowerCase();
function register(name,email,pw){name=name.trim();email=normMail(email);if(name.length<2)stop("Indtast dit fulde navn.");if(!/.+@.+\..+/.test(email))stop("Indtast en gyldig e-mailadresse.");if(pw.length<10)stop("Adgangskoden skal være mindst 10 tegn.");
  if(S.people.some(p=>p.email===email))stop("Der findes allerede en konto med denne e-mail. Log ind, eller nulstil adgangskoden.");const salt=uid(),code=uid()+uid();
  S.people.push({id:uid(),name,email,salt,pass:hashPw(pw,salt),verified:false,verifyCode:code,cvr:null,role:"",sens:false});mail(email,"Bekræft din e-mailadresse",`Hej ${name}\n\nBekræft din e-mailadresse for at komme i gang med ComplyChain.`,{label:"Bekræft e-mail",kind:"verify",code})}
function verify(code){const p=S.people.find(x=>x.verifyCode===code);if(!p)stop("Linket er ugyldigt eller allerede brugt.");p.verified=true;p.verifyCode=null;return p}
function login(email,pw){email=normMail(email);const p=S.people.find(x=>x.email===email);S.fails=S.fails||{};if((S.fails[email]||0)>=8)stop("For mange forsøg. Nulstil adgangskoden for at fortsætte.");
  if(!p||p.pass!==hashPw(pw,p.salt)){S.fails[email]=(S.fails[email]||0)+1;stop("Forkert e-mail eller adgangskode.")}if(p.deactivated)stop("Forkert e-mail eller adgangskode.");if(!p.verified)stop("Bekræft din e-mailadresse, før du logger ind. Linket ligger i test-mailboxen.");S.fails[email]=0;S.me=p.id;return p}
function forgot(email){email=normMail(email);const p=S.people.find(x=>x.email===email);if(p){p.resetCode=uid()+uid();mail(email,"Nulstil din adgangskode",`Hej ${p.name}\n\nDu kan vælge en ny adgangskode via linket. Har du ikke bedt om det, kan du se bort fra denne e-mail.`,{label:"Vælg ny adgangskode",kind:"reset",code:p.resetCode})}}
function resetPw(code,pw){const p=S.people.find(x=>x.resetCode&&x.resetCode===code);if(!p)stop("Linket er ugyldigt eller allerede brugt.");if(pw.length<10)stop("Adgangskoden skal være mindst 10 tegn.");p.salt=uid();p.pass=hashPw(pw,p.salt);p.resetCode=null;p.verified=true;S.fails&&(S.fails[p.email]=0)}
function changePw(cur,pw){const p=me();if(p.pass!==hashPw(cur,p.salt))stop("Den nuværende adgangskode er forkert.");if(pw.length<10)stop("Adgangskoden skal være mindst 10 tegn.");p.salt=uid();p.pass=hashPw(pw,p.salt)}
function createCompany(cvr){if(myCvr())stop("Du er allerede tilknyttet en virksomhed.");me().cvr=null;const c=ensureCo(cvr);if(c.workspace)stop("Virksomheden er allerede oprettet i ComplyChain. Bed en administrator i virksomheden om at invitere dig.");me().cvr=cvr;me().role="Ejer / Administrator";me().sens=true;workspace(cvr)}
function inviteUser(email,role,sens){if(me().role!=="Ejer / Administrator")stop("Kun Ejer/Administrator kan invitere brugere.");email=normMail(email);if(!/.+@.+\..+/.test(email))stop("Indtast en gyldig e-mailadresse.");const cvr=myCvr();
  if(S.people.some(p=>p.email===email&&p.cvr===cvr))stop("Brugeren er allerede tilknyttet virksomheden.");if(S.userInvites.some(i=>i.email===email&&i.cvr===cvr&&!i.done))stop("Der findes allerede en åben invitation til denne e-mailadresse.");
  const used=S.people.filter(p=>p.cvr===cvr&&!p.deactivated).length+S.userInvites.filter(i=>i.cvr===cvr&&!i.done).length;if(used>=SEATS)stop(`I har nået grænsen på ${SEATS} brugere. Kontakt ComplyChain om Enterprise for at tilføje flere.`);
  const inv={id:uid(),cvr,email,role,sens:!!sens,by:me().name,done:false};S.userInvites.push(inv);log("USER_INVITED",{co:cvr});mail(email,`${me().name} har inviteret dig til ${co(cvr).name} i ComplyChain`,`Du er inviteret med rollen ${role}. Invitationen er personlig og kan kun accepteres med denne e-mailadresse.`,{label:"Acceptér invitation",kind:"join",email},null,cvr)}
function myUserInvite(){return me()&&!myCvr()?S.userInvites.find(i=>i.email===me().email&&!i.done):null}
function joinCompany(){const i=myUserInvite();if(!i)stop("Invitationen findes ikke.");me().cvr=i.cvr;me().role=i.role;me().sens=i.sens;i.done=true;log("USER_JOINED",{co:i.cvr})}
function home(){if(!me())return"login";if(isAdmin())return"admin";if(myCvr())return"dashboard";return"company"}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return true}}catch(e){}return false}
</script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const go=(name,extra)=>{S.view=Object.assign({name},extra||{});$("side").classList.remove("open");render()};
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
const pill=(tone,txt)=>`<span class="pill ${tone}">${txt}</span>`;
const stPill=s=>!s?pill("","– Ikke kontrolleret endnu"):s==="COULD_NOT_CHECK"?pill("","? Kunne ikke kontrolleres"):s==="NORMAL"?pill("g","✓ NORMAL"):["TVANGSOPLØST","OPLØST","SLETTET"].includes(s)?pill("r","✕ "+esc(s)):pill("a","⚠ "+esc(s));
const regPill=s=>s==="REGISTERED"?pill("g","✓ Registreret"):s==="NOT_REGISTERED"?pill("a","⚠ Ikke registreret"):s==="COULD_NOT_CHECK"?pill("","? Kunne ikke kontrolleres"):pill("","– Ikke kontrolleret endnu");
const docPill=s=>s==="UPLOADED"?pill("g","✓ Uploadet"):s==="MISSING"?pill("a","⚠ Mangler"):pill("","○ Afventer");
const pPill=s=>({DRAFT:pill("","○ Kladde"),ACTIVE:pill("g","✓ Aktiv"),COMPLETED:pill("","🔒 Afsluttet"),PARTICIPATION_ENDED:pill("","Deltagelse afsluttet")})[s];
/* Medarbejderens effektive periode på projektet: egen registrering, afgrænset af virksomhedens deltagelse (relationens slutdato). Den oprindelige registrering ændres aldrig. */
function empPeriod(e,p){const rels=S.rels.filter(r=>r.project===p.id&&r.down===e.cvr&&r.acceptedAt);const live=rels.some(r=>r.status==="ACTIVE");const relEnd=live?"":rels.reduce((m,r)=>r.end&&r.end>m?r.end:m,"");const end=e.end&&(!relEnd||e.end<=relEnd)?e.end:relEnd;return{start:e.start,end,byRel:!!relEnd&&end===relEnd&&(!e.end||e.end>relEnd),registered:e.end||""}}
const empEndText=(pe)=>pe.end?dk(pe.end)+(pe.byRel?' <span class="sub">(deltagelse afsluttet)</span>':""):"åben";
const relPill=s=>({INVITED:pill("","○ Inviteret — afventer accept"),ACTIVE:pill("g","✓ Aktiv"),ENDED:pill("","Afsluttet")})[s]||"";
/* Plan udledes af virksomhedens FAKTISKE rettigheder — HE-adgang og UE-abonnement er uafhængige. */
function planLabel(c){const he=c.he==="APPROVED",sub=c.sub==="ACTIVE";const parts=[];if(he)parts.push(pill("g","✓ Gratis HE-adgang"));if(sub)parts.push(pill("g","✓ Underleverandør-abonnement (simuleret)"));if(c.he==="PENDING")parts.push(pill("a","○ HE-adgang afventer godkendelse"));if(c.he==="SUSPENDED")parts.push(pill("a","⚠ HE-adgang suspenderet"));if(!parts.length)parts.push(pill("","Ingen aktiv plan"));return parts.join(" ")}
const hePill=s=>({NONE:pill("","Ikke ansøgt"),PENDING:pill("","○ Afventer"),APPROVED:pill("g","✓ Godkendt"),REJECTED:pill("r","Afvist"),SUSPENDED:pill("a","⚠ Suspenderet")})[s];
const myActions=()=>isAdmin()?[]:S.actions.filter(a=>a.owner===myCvr()&&a.status==="OPEN");
const myNotifs=()=>isAdmin()?[]:S.notifs.filter(n=>n.to===myCvr());

function shell(){
  const v=S.view.name,m=me(),c=isAdmin()||!m.cvr?null:co(m.cvr);
  const nav=(name,label,count)=>`<button class="nav ${v===name||(name==="projects"&&v==="project")?"on":""}" data-go="${name}"><span>${label}</span>${count?`<b>${count}</b>`:""}</button>`;
  $("side").innerHTML=`<div class="logo"><i>⛓</i>ComplyChain</div>`+(isAdmin()
    ?`<div class="navh">Intern administration</div>${nav("admin","HE-ansøgninger",Object.values(S.companies).filter(x=>x.he==="PENDING").length)}${nav("simulator","Register og jobs")}${nav("mailbox","Sendte e-mails")}`
    :`${nav("dashboard","Dashboard")}${nav("projects","Projekter")}${nav("companies","Virksomheder")}${nav("actions","Handlinger",myActions().length)}<div class="navh">Dokumentation</div>${nav("eindkomst","eIndkomst")}${nav("monitoring","Registerkontrol")}<div class="navh">Administration</div>${nav("notifs","Notifikationer",myNotifs().filter(n=>!n.read).length)}${nav("settings","Indstillinger")}`)
    +`<div class="who"><strong>${esc(c?c.name:"ComplyChain")}</strong>${c?`CVR ${c.cvr} · `:""}${esc(m.role||"")}${c?`<div style="margin-top:6px">${planLabel(c)}</div>`:""}</div>`;
  $("top").innerHTML=`<button class="menu" data-act="menu" aria-label="Åbn menu">☰</button>
    <span><b>${esc(m.name)}</b> <span class="sub">${esc(m.email)}</span></span><button class="sm" data-act="logout">Log ud</button>
    <span class="sp"></span><button class="sm" data-go="mailbox">✉ Test-mailbox</button><span class="pill" title="Simuleret dansk tid. Klokkeslæt fastsættes, når hændelser opstår.">📅 ${dts(now())} (demotid)</span>
    <button class="sm" data-act="day" title="Kører de daglige jobs">Næste dag →</button><button class="sm" data-act="month" title="Springer til månedens sidste dag og kører månedligt snapshot">Månedsskifte →</button><button class="sm" data-act="reset" title="Sletter alle lokale testdata og genskaber det faste demosæt">Nulstil testdata</button>`;
}
const AUTH_VIEWS=["login","register","checkmail","forgot","reset","mailbox"];
let render=function(){
  if(!me()){if(!AUTH_VIEWS.includes(S.view.name))S.view={name:"login"};return renderAuth()}
  if(!isAdmin()&&!myCvr()&&!["company","invitation","mailbox"].includes(S.view.name))S.view={name:"company"};
  $("app").classList.remove("auth");$("side").hidden=!isAdmin()&&!myCvr();$("app").classList.toggle("nocomp",!isAdmin()&&!myCvr());shell();const v=S.view;let h="";
  try{h=(VIEWS[v.name]||VIEWS.dashboard)(v)}catch(e){h=`<div class="card"><h2>Siden blev ikke fundet</h2><p class="sub">${esc(e.message)}</p></div>`}
  $("view").innerHTML=`<div class="note" id="testnote"><b>Testversion i browseren.</b> Alle data gemmes lokalt i denne browser. E-mails, registeropslag og betalinger er simulerede — der sendes intet, og der betales intet. Log ud og ind som en anden virksomhed for at se, hvad den må se. Demotiden styres med “Næste dag” og “Månedsskifte”; “Nulstil” genskaber det faste demosæt.</div>`+h;save();
}
const VIEWS={};
const head=(t,sub,actions)=>`<div class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:""}</div><div class="row">${actions||""}</div></div>`;
/* Én fælles optælling: synlige virksomheder (identitet kendt, inkl. HE og én selv) og skjulte mellemled (kun antal — aldrig identitet). */
function chainCounts(p,cvr){const v=vis(p,cvr);return{visible:v.identity.size,hidden:v.hidden.size}}
const countText=(c,short)=>`${c.visible} synlige virksomhed${c.visible===1?"":"er"}`+(c.hidden?` · 🔒 ${c.hidden} skjult${c.hidden===1?"":"e"} mellemled`:"");
const stat=(l,v,s,goto)=>`<div class="card stat" ${goto?`data-go="${goto}" style="cursor:pointer"`:""}><span>${l}</span><strong>${v}</strong><small>${s||""}</small></div>`;

/* ---------------- Dashboard ---------------- */
VIEWS.dashboard=()=>{
  if(isAdmin())return VIEWS.admin();
  const cvr=myCvr(),c=co(cvr),ps=myProjects(cvr),act=ps.filter(p=>viewStatus(p,cvr)==="ACTIVE"),endedPart=ps.filter(p=>viewStatus(p,cvr)==="PARTICIPATION_ENDED");
  const ident=new Set(),det=new Set();let hid=0;act.forEach(p=>{const v=vis(p,cvr);v.identity.forEach(x=>x!==cvr&&ident.add(x));v.detail.forEach(x=>x!==cvr&&det.add(x));hid+=v.hidden.size});
  const docs=visibleDocs();const up=docs.filter(d=>d.status==="UPLOADED").length;
  const evs=S.events.filter(e=>det.has(e.cvr)&&e.projects.some(id=>act.some(p=>p.id===id))).sort(byNewest).slice(0,5);
  const recent=[];act.forEach(p=>{const v=vis(p,cvr);S.audit.filter(a=>a.project===p.id&&!a.type.startsWith("ACTION_C")&&auditVisible(a,v,cvr)).forEach(a=>recent.push([a,p]))});recent.sort((x,y)=>byNewest(x[0],y[0]));
  const myLatest=[...det].map(latestMonthly).filter(Boolean).sort((a,b)=>a.ym.localeCompare(b.ym)).pop();const lastD=det.size?[...det].map(x=>co(x).lastDaily).filter(Boolean).sort().pop():null;
  return head(`Goddag, ${esc(me().name.split(" ")[0])}`,`Overblik for ${esc(c.name)}. Tallene er faktuelle optællinger — ComplyChain beregner ingen score.`,c.he==="APPROVED"?`<button class="pri" data-go="newproject">+ Nyt projekt</button>`:"")
  +(c.he==="NONE"&&!ps.length?`<div class="card"><h2>Skal I oprette projekter som hovedentreprenør?</h2><p class="sub">HE-adgang er gratis og godkendes manuelt af ComplyChain. Deltager I kun som underleverandør, behøver I ikke ansøge.</p><div><button class="pri" data-go="settings">Ansøg om HE-adgang</button></div></div>`:"")
  +(c.he==="PENDING"?`<div class="card"><h2>HE-ansøgningen afventer behandling</h2><p class="sub">I testversionen: log ind som admin@complychain.dk for at godkende den.</p></div>`:"")
  +pendingInvites()
  +`<div class="grid g4">${stat("Aktive projekter",act.length,(endedPart.length?endedPart.length+" med afsluttet deltagelse · ":"")+ps.length+" i alt","projects")}${stat("Synlige virksomheder",ident.size,hid?`+ 🔒 ${hid} skjult(e) mellemled på aktive projekter`:"på aktive projekter — ekskl. jer selv","companies")}${stat("Registrerede medarbejdere",S.emps.filter(e=>act.some(p=>p.id===e.project&&vis(p,cvr).detail.has(e.cvr))).length,"på aktive projekter")}${stat("Åbne handlinger",myActions().length,myActions().length?"kræver opmærksomhed":"intet afventer","actions")}</div>
  <div class="grid g3"><div class="card"><h2>Dokumentation</h2><p class="sub">Månedlig eIndkomst på tværs af projekter</p><strong style="font-size:20px">${up} gennemført / ${docs.length-up} afventer</strong><div class="row">${docPill("UPLOADED")} ${up} ${docPill("PENDING")} ${docs.filter(d=>d.status==="PENDING").length} ${docPill("MISSING")} ${docs.filter(d=>d.status==="MISSING").length}</div></div>
  <div class="card"><h2>Daglig selskabsstatuskontrol</h2><p class="sub">Kun selskabets juridiske status</p>${det.size?`<p><b>Selskabsstatus kontrolleres dagligt.</b></p><p class="sub">${det.size} virksomhed(er) i jeres aktive kæder. Seneste kontrol: ${lastD?dk(lastD):"endnu ikke kørt"}</p>`:`<p class="sub">Ingen virksomheder i jeres aktive leverandørkæder — der udføres ingen daglig kontrol for jer${act.length?"":", da I ikke har aktive projekter"}.</p>`}</div>
  <div class="card"><h2>Månedligt compliance-snapshot</h2><p class="sub">Selskabsstatus · moms · arbejdsgiver</p>${det.size?`<p class="sub">${myLatest?`Seneste kontrolperiode for jeres kæder: <b>${ymLabel(myLatest.ym)}</b> (taget ${dts(myLatest.t)}).`:"Endnu intet månedligt snapshot for jeres kæder — tages ved månedens udgang."}</p>`:`<p class="sub">Ingen aktive leverandørkæder — der tages ingen månedlige snapshots for jer.</p>`}</div></div>
  <div class="grid g2"><div class="card"><h2>Seneste statusændringer</h2>${evs.length?evs.map(e=>`<div><b>${esc(co(e.cvr).name)}</b><br>${esc(lab(e.prev))} → ${esc(lab(e.next))}<small class="sub" style="display:block">${dts(e.t)}</small></div>`).join(""):`<p class="sub">Ingen registrerede ændringer i jeres leverandørkæder.</p>`}</div>
  <div class="card"><h2>Seneste aktivitet</h2>${recent.length?`<div class="tl">${recent.slice(0,7).map(([a,p])=>`<div>${esc(describe(a))}<time>${esc(p.name)} · ${dts(a.t)}</time></div>`).join("")}</div>`:`<p class="sub">Ingen aktivitet endnu.</p>`}</div></div>`;
};
function pendingInvites(){const rs=S.rels.filter(r=>(r.down===myCvr()||(!myCvr()&&r.email===me().email))&&r.status==="INVITED"&&proj(r.project).status==="ACTIVE");return rs.map(r=>`<div class="card" style="border-color:var(--acc)"><h3>Projektinvitation</h3><h2>${esc(proj(r.project).name)}</h2><p class="sub"><b>${esc(co(r.up).name)}</b> har inviteret ${esc(co(r.down).name)} til at deltage som underleverandør. Hovedentreprenør: ${esc(co(proj(r.project).he).name)}.</p><div><button class="pri" data-go="invitation" data-id="${r.id}">Åbn invitation</button></div></div>`).join("")}
function visibleDocs(pid){const cvr=myCvr();runQuiet();return S.docs.filter(d=>(!pid||d.project===pid)&&canSee(proj(d.project))&&vis(proj(d.project),cvr).detail.has(d.cvr))}
function runQuiet(){}

/* ---------------- Projekter ---------------- */
VIEWS.projects=()=>{const cvr=myCvr(),ps=myProjects(cvr);return head("Projekter","Projekter I ejer som hovedentreprenør, og projekter I deltager på som underleverandør.",co(cvr).he==="APPROVED"?`<button class="pri" data-go="newproject">+ Nyt projekt</button>`:`<button data-go="settings">HE-adgang</button>`)
  +(ps.length?`<div class="grid g2">${ps.map(p=>{const v=vis(p,cvr);return`<div class="card" data-go="project" data-id="${p.id}" style="cursor:pointer"><div class="head"><div><h2>${esc(p.name)}</h2><span class="sub">${esc(p.ref)}</span></div>${pPill(viewStatus(p,cvr))}</div><p class="sub">📍 ${esc(p.address)}, ${esc(p.city)} · ${dk(p.start)}${viewStatus(p,cvr)==="PARTICIPATION_ENDED"?` · jeres deltagelse sluttede ${dk(participationEnd(p,cvr))}`:""}</p><div class="row">${pill("",p.he===cvr?"Vi er HE":"HE: "+esc(co(p.he).name))}<span class="sub">${countText(chainCounts(p,cvr))}</span></div></div>`}).join("")}</div>`:`<div class="card"><h2>Ingen projekter endnu</h2><p class="sub">Projekter vises her, når I opretter et projekt eller accepterer en projektinvitation.</p></div>`)};
VIEWS.newproject=()=>co(myCvr()).he!=="APPROVED"?head("Nyt projekt")+`<div class="card"><h2>Kræver godkendt HE-adgang</h2><p class="sub">Jeres virksomhed skal have godkendt HE-adgang for at oprette projekter.</p><div><button data-go="settings">Se HE-adgang</button></div></div>`
  :head("Nyt projekt","Kun de nødvendige oplysninger. En kladde sender ingen invitationer og starter ingen overvågning.")+`<div class="card"><div class="grid g2"><div class="f"><label for="p-name">Projektnavn</label><input id="p-name" placeholder="Fx Project Alpha"></div><div class="f"><label for="p-ref">Reference (valgfri)</label><input id="p-ref"></div><div class="f"><label for="p-start">Startdato</label><input id="p-start" type="date" value="${S.today}"></div><div class="f"><label for="p-end">Forventet slutdato (valgfri)</label><input id="p-end" type="date"></div><div class="f"><label for="p-address">Primær lokation — adresse</label><input id="p-address"></div><div class="f"><label for="p-city">By</label><input id="p-city"></div></div>
  <h3>Bygherre (valgfri — erstatter aldrig jer som projektets ejer)</h3><div class="f"><label for="p-client">Bygherrens navn</label><input id="p-client"></div><label class="chk"><input type="checkbox" id="p-show"><span><b>Vis bygherre i leverandørkæden</b><br><span class="sub">Slået fra: kæden begynder med jer som HE.</span></span></label>
  <div class="row" style="justify-content:flex-end"><button data-go="projects">Annullér</button><button data-act="draft">Gem kladde</button><button class="pri" data-act="create">Opret projekt</button></div></div>`;

/* ---------------- Projektside ---------------- */
VIEWS.project=v=>{const p=proj(v.id);if(!p||!canSee(p))throw new Error("Projektet findes ikke, eller du har ikke adgang.");const cvr=myCvr(),isHE=p.he===cvr,tab=v.tab||"oversigt",open=canEdit(p,cvr),vs=viewStatus(p,cvr);
  const tabs=[["oversigt","Oversigt"],["kaede","Leverandørkæde"],["medarbejdere","Medarbejdere"],["eindkomst","eIndkomst"],["historik","Historik"],["rapport","Rapport"]];
  const own=S.rels.find(r=>r.project===p.id&&r.down===cvr&&r.status==="ACTIVE");
  return `<div><button class="lnk" data-go="projects">‹ Projekter</button></div>`+head(`${esc(p.name)} ${pPill(vs)}`,`${esc(p.address)}, ${esc(p.city)} · ${dk(p.start)} · HE: ${esc(co(p.he).name)}`,
    (open?`<button class="pri" data-go="addsupplier" data-id="${p.id}">+ Tilføj underleverandør</button>`:"")+(isHE&&p.status==="DRAFT"?`<button class="pri" data-act="activate" data-id="${p.id}">Opret projekt</button>`:"")+(isHE&&open?`<button data-go="complete" data-id="${p.id}">Afslut projekt</button>`:""))
  +(vs==="PARTICIPATION_ENDED"?`<div class="card"><h2>Jeres deltagelse på projektet sluttede ${dk(participationEnd(p,cvr))}</h2><p class="sub">Projektet fortsætter hos hovedentreprenøren, men jeres relation er afsluttet af jeres opdragsgiver. I kan ikke længere invitere underleverandører eller registrere medarbejdere. Historik, kæde og rapport for jeres deltagelsesperiode er fortsat tilgængelige, og eIndkomst for måneder inden for deltagelsen kan stadig dokumenteres.</p></div>`:"")+(p.status==="COMPLETED"?`<div class="card"><h2>🔒 Projektet er afsluttet ${dk(p.completedAt)}</h2><p class="sub">Der er oprettet et uforanderligt afsluttende snapshot. Almindelig redigering er låst — historik og Compliance Report er fortsat tilgængelige.</p></div>`:"")
  +(own&&!own.mode&&open?`<div class="card" style="border-color:var(--acc)"><h2>Næste trin: Hvem udfører arbejdet?</h2><div><button class="pri" data-go="onboarding" data-id="${own.id}">Fortsæt</button></div></div>`:"")
  +`<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-go="project" data-id="${p.id}" data-tab="${k}">${l}</button>`).join("")}</div>`+TABS[tab](p,cvr,isHE,open)};
const TABS={};
function chainHtml(p,viewer,interactive){const cv=chainView(p,viewer);const kids=k=>cv.links.filter(l=>l.from===k);
  const node=(n,l)=>{if(n.kind==="HIDDEN")return`<div class="node hid"><i>🔒</i><span><strong>Skjult virksomhed</strong><small>Mellemled, som ikke er synligt for jer</small></span></div>`;
    const ic=n.kind==="CLIENT"?"🏛":n.kind==="HE"?"♛":"▦";const inner=`<i>${ic}</i><span><strong>${esc(n.name)}${n.kind==="HE"?`<span class="tag">HE</span>`:""}${n.kind==="CLIENT"?`<span class="tag">BYGHERRE</span>`:""}${n.self?`<span class="tag me">JER</span>`:""}</strong><small>${n.cvr?"CVR "+n.cvr:""}${n.detail&&n.kind==="CO"?` · 👥 ${S.emps.filter(e=>e.project===p.id&&e.cvr===n.cvr).length}`:""}</small>${l&&(l.status==="INVITED"||l.status==="ENDED")?`<small>${relPill(l.status)}</small>`:""}${n.detail&&co(n.cvr).cur&&co(n.cvr).cur!=="NORMAL"?`<small>${stPill(co(n.cvr).cur)}</small>`:""}</span>`;
    return interactive&&n.kind!=="CLIENT"?`<button class="node ${n.kind==="HE"?"he":""} ${n.self?"self":""}" data-act="node" data-p="${p.id}" data-key="${n.key}" data-rel="${l&&l.rel||""}">${inner}</button>`:`<div class="node ${n.kind==="HE"?"he":""} ${n.self?"self":""}">${inner}</div>`};
  const branch=(k,l,seen)=>{const n=cv.nodes.find(x=>x.key===k);if(!n||seen.includes(k))return"";const ks=kids(k);return`<li>${node(n,l)}${ks.length?`<ul>${ks.map(x=>branch(x.to,x,[...seen,k])).join("")}</ul>`:""}</li>`};
  return`<div class="chain tw"><ul>${branch(cv.root,null,[])}</ul></div>`+(cv.hiddenCount?`<p class="note" style="background:var(--soft);color:var(--mut)">🔒 ${cv.hiddenCount} mellemled er skjult. I kan se hovedentreprenøren, jeres direkte opdragsgiver, jer selv og hele jeres egen nedstrøms kæde.</p>`:"")}
TABS.oversigt=(p,cvr,isHE)=>{const v=vis(p,cvr);const docs=visibleDocs(p.id);const up=docs.filter(d=>d.status==="UPLOADED").length;
  return`<div class="grid g4">${stat("Synlige virksomheder i kæden",v.identity.size,v.hidden.size?`+ 🔒 ${v.hidden.size} skjult(e) mellemled — kun antal, ikke identitet`:"inkl. HE og jer selv")}${stat("Registrerede medarbejdere",S.emps.filter(e=>e.project===p.id&&v.detail.has(e.cvr)).length)}${stat("Åbne handlinger",myActions().filter(a=>a.projects.includes(p.id)).length)}${stat("eIndkomst",`<span style="font-size:18px">${up} gennemført / ${docs.length-up} afventer</span>`)}</div>
  <div class="grid g2"><div class="card"><h2>Leverandørkæde</h2>${chainHtml(p,cvr,false)}</div><div class="card"><h2>Projektoplysninger</h2><dl><div><dt>Hovedentreprenør (HE)</dt><dd>${esc(co(p.he).name)}</dd></div>${p.client&&(isHE||p.showClient)?`<div><dt>Bygherre</dt><dd>${esc(p.client)}${isHE?`<br><span class="sub">${p.showClient?"Vises i kæden":"Vises ikke i kæden"}</span>`:""}</dd></div>`:""}<div><dt>Periode</dt><dd>${dk(p.start)} – ${p.end?dk(p.end):"åben"}</dd></div><div><dt>Lokation</dt><dd>${esc(p.address)}, ${esc(p.city)}</dd></div></dl></div></div>`};
TABS.kaede=(p,cvr)=>`<div class="card"><div><h2>Leverandørkæde</h2><p class="sub">Klik på en virksomhed for at se detaljer uden at forlade kæden.</p></div>${chainHtml(p,cvr,true)}</div><p class="sub">Hver virksomhed opretter og står bag sin egen direkte underleverandør. Accepterede relationer slettes aldrig — de afsluttes med en slutdato.</p>`;
TABS.medarbejdere=(p,cvr,isHE,open)=>{const v=vis(p,cvr);const rows=S.emps.filter(e=>e.project===p.id&&v.detail.has(e.cvr));const can=open;
  return`<div class="card flush"><div class="ch head"><div><h2>Medarbejdere på projektet</h2><p class="sub">Hver virksomhed registrerer og står inde for sine egne medarbejdere. Intet CPR, ingen løn, ingen tidsberegning.</p></div>${can?`<button class="pri" data-go="employees" data-id="${p.id}">+ Registrér medarbejdere</button>`:""}</div>${rows.length?`<div class="tw"><table><tr><th>Medarbejder</th><th>Arbejdsgiver</th><th>Funktion</th><th>Start</th><th>Slut</th></tr>${rows.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(co(e.cvr).name)}<small>CVR ${e.cvr}</small></td><td>${esc(e.role||"–")}</td><td>${dk(e.start)}</td><td>${empEndText(empPeriod(e,p))}</td></tr>`).join("")}</table></div>`:`<p class="sub" style="padding:0 20px 20px">Ingen medarbejdere registreret endnu.</p>`}</div>`};
function docTable(docs,showProject){if(!docs.length)return`<p class="sub" style="padding:0 20px 20px">Ingen dokumentationsperioder endnu. Perioder oprettes automatisk, når en kalendermåned er afsluttet (prøv “Månedsskifte” og “Næste dag”).</p>`;const cvr=myCvr();const ks=[...new Set(docs.map(d=>d.ym))].sort().reverse();
  return ks.map(k=>`<div class="li" style="background:var(--soft)"><b>${ymLabel(k)}</b></div><div class="tw"><table><tr><th>Virksomhed</th>${showProject?"<th>Projekt</th>":""}<th>Status</th><th>Versioner</th><th></th></tr>${docs.filter(d=>d.ym===k).map(d=>{const p=proj(d.project);const canOpen=me().sens&&(d.cvr===cvr||p.he===cvr);return`<tr><td><b>${esc(co(d.cvr).name)}</b></td>${showProject?`<td>${esc(p.name)}</td>`:""}<td>${docPill(d.status)}${d.status!=="UPLOADED"?`<small>Frist ${dk(d.due)}</small>`:""}</td><td>${d.versions.map(x=>`<div><span class="tag">v${x.no}</span> ${dts(x.at)} · ${esc(x.by)} · ${canOpen?`<button class="lnk" data-act="openfile" data-f="${esc(x.file)}">Åbn</button>`:`🔒`}</div>`).join("")||"–"}</td><td>${d.cvr===cvr?`<button class="sm ${d.status==="UPLOADED"?"":"pri"}" data-go="upload" data-id="${d.project}" data-ym="${d.ym}">${d.status==="UPLOADED"?"Ny version":"Upload eIndkomst"}</button>`:""}</td></tr>`}).join("")}</table></div>`).join("")}
TABS.eindkomst=(p,cvr,isHE)=>`<div class="card flush"><div class="ch head"><div><h2>Månedlig eIndkomst</h2><p class="sub">${isHE?"Hver underleverandør uploader sin egen dokumentation. I kan følge status — ikke uploade på andres vegne.":"I uploader jeres egen dokumentation for hver kalendermåned. En ny upload i samme måned gemmes som en ny version."}</p></div>${!isHE?`<button class="pri" data-go="upload" data-id="${p.id}">Upload eIndkomst</button>`:""}</div>${docTable(visibleDocs(p.id))}</div><p class="sub">Status “Uploadet” er ikke en godkendelse. ComplyChain vurderer ikke indholdet.</p>`;
TABS.historik=(p,cvr)=>{const v=vis(p,cvr);const rows=S.audit.filter(a=>a.project===p.id&&auditVisible(a,v,cvr)).sort(byNewest);return`<div class="card"><p class="sub">Historikken er projektets “flight recorder”: tidsstemplet og uforanderlig — <b>nyeste hændelse øverst</b>. Tidspunktet fastsættes, når hændelsen opstår. Hændelser kan hverken redigeres eller slettes.</p>${rows.length?`<div class="tl">${rows.map(a=>`<div>${esc(describe(a))}<time>${dts(a.t)}</time></div>`).join("")}</div>`:`<p class="sub">Ingen hændelser endnu.</p>`}</div>`};
TABS.rapport=(p)=>p.status==="DRAFT"?`<div class="card"><p class="sub">Rapporter kan genereres, når projektet er oprettet.</p></div>`:`<div class="card"><h2>Generér Compliance Report</h2><p class="sub">Rapporten bygges af de historiske registreringer — ikke af dagens registerstatus — og følger jeres synlighed i kæden. Genereringstidspunktet er det aktuelle (demo)tidspunkt, og til-datoen kan højst være dags dato.</p><div class="grid g2"><div class="f"><label for="r-from">Fra</label><input id="r-from" type="date" value="${p.start}" min="${p.start}" max="${S.today}"></div><div class="f"><label for="r-to">Til</label><input id="r-to" type="date" value="${p.completedAt||S.today}" min="${p.start}" max="${S.today}"></div></div><div><button class="pri" data-act="report" data-id="${p.id}">Generér Compliance Report</button></div></div>`
  +S.reports.filter(r=>r.project===p.id&&r.forCvr===myCvr()).sort(byNewest).map(r=>`<div class="li card" style="flex-direction:row"><div><b>v${r.no} · ${dk(r.from)} – ${dk(r.to)}</b><small>${dts(r.t)} · ${esc(r.by)}</small></div><button data-go="report" data-id="${r.id}">Åbn</button></div>`).join("");
</script>
<script>
"use strict";
/* ---------------- Tilføj underleverandør ---------------- */
VIEWS.addsupplier=v=>{const p=proj(v.id);if(!p||!canSee(p))throw new Error("Ikke fundet");const q=(v.q||"").trim().toLowerCase();const res=q.length>1?Object.entries(S.registry).filter(([c,g])=>c===q||g.name.toLowerCase().includes(q)):[];const g=v.cvr&&S.registry[v.cvr];
  return`<div><button class="lnk" data-go="project" data-id="${p.id}" data-tab="kaede">‹ ${esc(p.name)}</button></div>`+head("Tilføj underleverandør",`I inviterer jeres egen direkte underleverandør på vegne af ${esc(co(myCvr()).name)}.`)
  +`<div class="card"><h2>1. Find virksomheden</h2><div class="row"><input id="s-q" style="flex:1" placeholder="CVR-nummer eller virksomhedsnavn" value="${esc(v.q||"")}"><button data-act="search" data-id="${p.id}">Søg</button></div><p class="sub">Testregister: ${Object.entries(S.registry).map(([c,x])=>`${esc(x.name)} (${c})`).join(" · ")}</p>${res.map(([c,x])=>`<div class="li"><div><b>${esc(x.name)}</b><small>CVR ${c} · ${esc(x.city)}</small></div><button class="sm" data-go="addsupplier" data-id="${p.id}" data-cvr="${c}">Vælg</button></div>`).join("")}${q.length>1&&!res.length?`<p class="sub">Ingen virksomheder matcher søgningen.</p>`:""}</div>`
  +(g?`<div class="card"><h2>2. Offentlige virksomhedsoplysninger</h2><p class="sub">Hentet automatisk — der skal ikke uploades attester.</p><dl><div><dt>Virksomhed</dt><dd><b>${esc(g.name)}</b><br>CVR ${v.cvr}</dd></div><div><dt>Branche</dt><dd>${esc(g.industry)}</dd></div><div><dt>Selskabsstatus</dt><dd>${stPill(g.fail?"COULD_NOT_CHECK":g.status)}</dd></div><div><dt>Momsregistrering</dt><dd>${regPill(g.fail?"COULD_NOT_CHECK":g.vat?"REGISTERED":"NOT_REGISTERED")}</dd></div><div><dt>Arbejdsgiverregistrering</dt><dd>${regPill(g.fail?"COULD_NOT_CHECK":g.emp?"REGISTERED":"NOT_REGISTERED")}</dd></div></dl><p class="sub">Seneste offentlige medarbejderdata: ${g.interval} medarbejdere, periode ${g.period}. Offentlige data er historiske og afspejler ikke nødvendigvis virksomhedens aktuelle bemanding.</p></div>
  <div class="card"><h2>3. Kontaktperson</h2><div class="grid g2"><div class="f"><label for="s-contact">Kontaktperson</label><input id="s-contact"></div><div class="f"><label for="s-email">E-mail</label><input id="s-email" type="email"></div></div><div class="row" style="justify-content:flex-end"><button class="pri" data-act="invite" data-id="${p.id}" data-cvr="${v.cvr}">Send invitation</button></div></div>`:"")};

/* ---------------- Leverandørens invitation (mobilvenligt selvbetjeningsflow) ---------------- */
VIEWS.invitation=v=>{const r=myInvite(v.id);if(!r)throw new Error("Invitationen findes ikke.");const p=proj(r.project),c=co(r.down);const step=r.status==="ACTIVE"?3:myCvr()!==r.down?0:c.sub!=="ACTIVE"?1:2;
  const steps=["Virksomhed","Abonnement","Acceptér","Medarbejdere"].map((s,i)=>`<span class="${i<step?"ok":i===step?"on":""}">${i<step?"✓ ":""}${s}</span>`).join("");
  return`<div style="max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%"><div class="steps">${steps}</div><div class="card"><h3>Projektinvitation</h3><h1>${esc(p.name)}</h1><p><b>${esc(co(r.up).name)}</b> har inviteret <b>${esc(c.name)}</b> til at deltage som underleverandør.</p><dl><div><dt>Hovedentreprenør</dt><dd>${esc(co(p.he).name)}</dd></div><div><dt>Projektperiode</dt><dd>${dk(p.start)}</dd></div><div><dt>Lokation</dt><dd>${esc(p.city)}</dd></div></dl></div>`
  +(step===0?`<div class="card"><h2>Bekræft virksomhed</h2><p><b>${esc(c.name)}</b> · CVR ${c.cvr}</p><p class="sub">${c.workspace?"Virksomheden findes allerede i ComplyChain. Du skal inviteres som bruger af en administrator.":"Ved at bekræfte opretter du virksomheden i ComplyChain og bliver dens første Ejer/Administrator."}</p><button class="pri" data-act="claim" data-id="${r.id}">Bekræft — jeg handler på vegne af virksomheden</button></div>`:"")
  +(step===1?`<div class="card"><h2>Aktivér abonnement</h2><p class="sub">Deltagelse som underleverandør kræver ét abonnement pr. virksomhed (CVR).</p><div><span style="font-size:34px;font-weight:600">${PRICE} kr.</span> <span class="sub">pr. måned + moms · fornyes automatisk hver måned</span></div><p class="sub">✓ Ét abonnement dækker alle projekter, kunder og leverandørkæder<br>✓ I betaler aldrig pr. projekt eller pr. invitation</p><p class="note">Browserdemo: der gennemføres ingen betaling. I produktionen aktiveres abonnementet først via en verificeret betalingswebhook (INTEGRATION_TBD).</p><button class="pri" data-act="pay" data-id="${r.id}">Aktivér abonnement (simuleret betaling)</button></div>`:"")
  +(step===2?`<div class="card"><h2>Acceptér projektdeltagelse</h2><p class="sub">Jeres abonnement er aktivt (simuleret) — der kræves ingen ny betaling for dette projekt.</p><label class="chk"><input type="checkbox" id="a-ok"><span>Jeg accepterer på vegne af ${esc(c.name)} at deltage i projektet som underleverandør til ${esc(co(r.up).name)}.</span></label><button class="pri" data-act="accept" data-id="${r.id}">Acceptér projekt</button><p class="sub">Vi registrerer, hvem der accepterede, på vegne af hvilken virksomhed — og hvornår.</p></div>`:"")
  +(step===3?`<div class="card"><h2>✓ Invitationen er accepteret</h2><button class="pri" data-go="onboarding" data-id="${r.id}">Fortsæt</button></div>`:"")+`</div>`};
VIEWS.onboarding=v=>{const r=S.rels.find(x=>x.id===v.id&&x.down===myCvr());if(!r)throw new Error("Ikke fundet");const opts=[["OWN","Kun egne medarbejdere","Arbejdet udføres af medarbejdere ansat i jeres virksomhed."],["BOTH","Egne medarbejdere + underleverandører","I bruger både egne medarbejdere og en eller flere underleverandører."],["SUBS","Arbejdet udføres udelukkende af underleverandører","I har ingen egne medarbejdere på projektet."]];
  return`<div style="max-width:640px;margin:0 auto;width:100%" class="card"><h2>Hvem udfører arbejdet?</h2><p class="sub">Svaret afgør de næste trin.</p>${opts.map(([k,t,d])=>`<label class="chk"><input type="radio" name="mode" value="${k}" ${r.mode===k?"checked":""}><span><b>${t}</b><br><span class="sub">${d}</span></span></label>`).join("")}<div class="row" style="justify-content:flex-end"><button class="pri" data-act="mode" data-id="${r.id}">Fortsæt</button></div></div>`};
VIEWS.employees=v=>{const p=proj(v.id);return`<div style="max-width:760px;margin:0 auto;width:100%" class="card"><h2>Registrér jeres medarbejdere på ${esc(p.name)}</h2><p class="sub">Arbejdsgiver: ${esc(co(myCvr()).name)} (CVR ${myCvr()}) — udledes automatisk. Vi beder kun om det nødvendige.</p>${[0,1,2,3].map(i=>`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><div class="f"><label for="e-n${i}">Fulde navn</label><input id="e-n${i}"></div><div class="f"><label for="e-r${i}">Funktion (valgfri)</label><input id="e-r${i}"></div><div class="f"><label for="e-s${i}">Start</label><input id="e-s${i}" type="date" value="${S.today}"></div></div>`).join("")}<label class="chk"><input type="checkbox" id="e-ok"><span>Jeg bekræfter på vegne af ${esc(co(myCvr()).name)}, at ovenstående oplysninger er korrekte og retvisende på tidspunktet for registreringen.</span></label><p class="sub">Tilhører en person en anden virksomhed? Så skal den virksomhed inviteres som jeres underleverandør.</p><div class="row" style="justify-content:flex-end"><button data-go="project" data-id="${p.id}">Senere</button><button class="pri" data-act="regemps" data-id="${p.id}" data-next="${v.next||""}">Bekræft og registrér</button></div></div>`};
VIEWS.upload=v=>{const p=proj(v.id);const cvr=myCvr();const all=months(p.id,cvr);const ok=uploadable(p.id,cvr);const fixed=v.ym&&ok.includes(v.ym)?v.ym:null;const cur=all.filter(k=>!closedMonth(k));
  const info=k=>{const d=S.docs.find(x=>x.project===p.id&&x.cvr===cvr&&x.ym===k);return d&&d.versions.length?` — v${d.versions.length} findes, ny upload bliver v${d.versions.length+1}`:d?` — ${d.status==="MISSING"?"mangler":"afventer"}`:""};

VIEWS.complete=v=>{const p=proj(v.id);const docs=S.docs.filter(d=>d.project===p.id&&d.status!=="UPLOADED");return head("Afslut projekt","Gennemgå overblikket, før I bekræfter. Afslutningen kan ikke fortrydes.")+`<div class="card"><h2>Leverandørkæden ved afslutning</h2>${chainHtml(p,myCvr(),false)}</div><div class="card"><h2>Åbne dokumentationspunkter</h2><p class="sub">Manglende dokumentation blokerer ikke afslutningen. Den dokumenteres, som den er.</p>${docs.map(d=>`<div class="row">${esc(co(d.cvr).name)} — ${ymLabel(d.ym)} ${docPill(d.status)}</div>`).join("")||`<p class="sub">Ingen åbne punkter.</p>`}</div><div class="card"><h2>Det sker, når I bekræfter</h2><p class="sub">Der oprettes et uforanderligt afsluttende snapshot · projektet får status Afsluttet · almindelig redigering låses · historik og rapport bevares. Intet slettes.</p><label class="chk"><input type="checkbox" id="c-ok"><span>Jeg bekræfter på vegne af ${esc(co(myCvr()).name)}, at projektet skal afsluttes.</span></label><div class="row" style="justify-content:flex-end"><button data-go="project" data-id="${p.id}">Annullér</button><button class="pri" data-act="complete" data-id="${p.id}">Afslut projekt</button></div></div>`};

/* ---------------- Compliance Report (gemt, allerede-filtreret projektion) ----------------
   Genereringstidspunktet fastsættes FØRST; alt indhold filtreres til hændelser <= dette tidspunkt og inden for perioden.
   Rapporten bygges udelukkende af historiske registreringer og af den synlighed, brugeren har i kæden. Skjulte mellemled indgår kun som antal. */
/* Én validering af rapportperioden — kaldes både fra formularen og fra makeReport, så en omvendt eller forkert periode aldrig bliver til en rapport. */
function validatePeriod(p,from,to){if(!from||!to)stop("Vælg både fra- og til-dato.");if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to))stop("Ugyldig dato.");
  if(to<p.start)stop(`Perioden ${dk(from)} – ${dk(to)} ligger helt før projektets start ${dk(p.start)}. Vælg en periode fra projektstart og frem.`);
  if(from<p.start)stop(`Fra-datoen kan tidligst være projektets startdato ${dk(p.start)}.`);
  if(to<from)stop(`Ugyldigt datointerval: til-datoen ${dk(to)} ligger før fra-datoen ${dk(from)}.`);
  if(to>S.today)stop(`Til-datoen kan ikke ligge efter dags dato (${dk(S.today)}). Rapporten kan kun dække registrerede hændelser.`);return{from,to}}
function makeReport(pid,from,to){const p=proj(pid),cvr=myCvr();if(!canSee(p))stop("Ikke fundet.");if(p.status==="DRAFT")stop("Rapporter kan først genereres, når projektet er oprettet.");({from,to}=validatePeriod(p,from,to));
  const t=stamp();const v=vis(p,cvr),cv=chainView(p,cvr);const d10=x=>(x||"").slice(0,10);const inP=x=>x&&d10(x)>=from&&d10(x)<=to&&x<=t;
  const name=k=>{const n=cv.nodes.find(x=>x.key===k);return!n?"–":n.kind==="HIDDEN"?"🔒 Skjult virksomhed":n.name};
  const links=cv.links.filter(l=>l.from!=="client"&&l.status!=="INVITED").map(l=>{const r=l.rel&&S.rels.find(x=>x.id===l.rel);let status="",periodText="";
    if(r){const acc=d10(r.acceptedAt);if(acc>to){status="NOT_YET";periodText="Indtrådte først "+dk(acc)+" — efter perioden"}else if(r.end&&r.end<=to){status="ENDED";periodText=(acc>=from?"Indtrådte "+dk(acc)+" · ":"")+"Afsluttet pr. "+dk(r.end)+(r.end<from?" — før perioden":"")}else{status="ACTIVE";periodText=acc>=from?"Indtrådte "+dk(acc):"Aktiv i hele perioden"}}
    else{status=l.status||"PATH";periodText="Relation på vejen til HE — detaljer ikke synlige"}
    return{up:name(l.from),down:name(l.to),status,periodText}}).filter(l=>l.status!=="NOT_YET"||true);
  const comps=[...v.detail].filter(c=>c!==p.he||v.isHE).filter(c=>c===p.he||S.rels.some(r=>r.project===pid&&r.down===c&&r.acceptedAt&&d10(r.acceptedAt)<=to)).map(c=>{const daily=S.checks.filter(x=>x.cvr===c&&inP(x.t)).sort(byNewest);return{name:co(c).name,cvr:c,
    snaps:S.snaps.filter(x=>x.cvr===c&&inP(x.t)&&(x.type==="MONTHLY"||x.project===pid)).map(x=>({...x})).sort(byNewest),
    daily:{n:daily.length,fail:daily.filter(x=>!x.ok).length,first:daily.length?daily[daily.length-1].t:null,last:daily.length?daily[0].t:null},
    events:S.events.filter(e=>e.cvr===c&&e.projects.includes(pid)&&inP(e.t)).map(e=>({...e})).sort(byNewest),
    emps:S.emps.filter(e=>e.project===pid&&e.cvr===c&&e.t<=t).map(e=>({...empPeriod(e,p),name:e.name,role:e.role,t:e.t})).filter(e=>(!e.end||e.end>=from)&&e.start<=to),
    docs:S.docs.filter(d=>d.project===pid&&d.cvr===c&&d.ym>=ym(from)&&d.ym<=ym(to)).map(d=>{const vs=d.versions.filter(x=>x.at<=t);return{ym:d.ym,status:vs.length?"UPLOADED":d.status,due:d.due,versions:vs.map(x=>({no:x.no,at:x.at,by:x.by,file:x.file}))}}).sort((x,y)=>y.ym.localeCompare(x.ym))}});
  const data={project:{name:p.name,ref:p.ref,status:p.status,start:p.start,completedAt:p.completedAt||null,address:p.address+", "+p.city},he:co(p.he).name,client:p.client&&(v.isHE||p.showClient)?p.client:null,isHE:v.isHE,
    links,hidden:cv.hiddenCount,companies:comps,final:p.finalSnapshot&&p.finalSnapshot.t<=t?p.finalSnapshot.t:null,
    audit:S.audit.filter(a=>a.project===pid&&inP(a.t)&&!a.type.startsWith("ACTION_C")&&auditVisible(a,v,cvr)).map(a=>({t:a.t,seq:a.seq,text:describe(a)})).sort(byNewest)};
  const r={id:uid(),project:pid,forCvr:cvr,forName:co(cvr).name,by:me().name,t,from,to,no:S.reports.filter(x=>x.project===pid&&x.forCvr===cvr).length+1,data};S.reports.push(r);log("REPORT",{co:cvr,owner:cvr,no:r.no},pid,null,t);return r}
VIEWS.report=v=>{const r=S.reports.find(x=>x.id===v.id&&x.forCvr===myCvr());if(!r)throw new Error("Rapporten blev ikke fundet.");const d=r.data;const SN={MONTHLY:"Månedligt snapshot",ONBOARDING:"Onboarding",PROJECT_ACTIVATION:"Projektstart",RELATIONSHIP_ACTIVATION:"Indtræden i kæden",PROJECT_COMPLETION:"Projektafslutning"};const KI={STATUS:"Virksomhedsstatus",VAT:"Momsregistrering",EMPLOYER:"Arbejdsgiverregistrering"};
  const relP=l=>l.status==="ACTIVE"?pill("g","✓ Aktiv"):l.status==="ENDED"?pill("","Afsluttet"):l.status==="NOT_YET"?pill("","Ikke i perioden"):pill("","–");
  const empty=(arr,txt)=>arr.length?"":`<p class="sub">${txt}</p>`;
  return`<div class="noprint"><button class="lnk" data-go="project" data-id="${r.project}" data-tab="rapport">‹ ${esc(d.project.name)}</button> · <button class="lnk" data-act="print">Udskriv / gem som PDF</button></div>
  <div class="card report" style="border-top:4px solid var(--side)"><h3>ComplyChain · Compliance Report · v${r.no}</h3><h1>${esc(d.project.name)}</h1><dl><div><dt>Rapportperiode</dt><dd>${dk(r.from)} – ${dk(r.to)}</dd></div><div><dt>Genereret</dt><dd>${dts(r.t)} af ${esc(r.by)}</dd></div><div><dt>Genereret for</dt><dd>${esc(r.forName)}${d.isHE?" (hovedentreprenør)":" (underleverandør)"}</dd></div><div><dt>Tidsangivelser</dt><dd>Simuleret dansk tid · nyeste øverst</dd></div></dl>
  <p class="note" style="background:var(--soft);color:var(--ink)">Rapporten dokumenterer de oplysninger, kontroller og dokumenter, der var registreret på de angivne tidspunkter, og indeholder kun hændelser til og med genereringstidspunktet. Den følger ${esc(r.forName)}s synlighed i leverandørkæden. Rapporten er <b>ikke</b> en godkendelse fra Skattestyrelsen eller en anden myndighed og er ikke en garanti for, at en virksomhed overholder gældende skatte-, moms- eller ansættelsesregler.</p>
  <h2>1. Projekt og parter</h2><dl><div><dt>Hovedentreprenør (HE)</dt><dd>${esc(d.he)}</dd></div>${d.client?`<div><dt>Bygherre</dt><dd>${esc(d.client)}</dd></div>`:""}<div><dt>Reference</dt><dd>${esc(d.project.ref||"–")}</dd></div><div><dt>Status</dt><dd>${({ACTIVE:"Aktiv",COMPLETED:"Afsluttet "+dk(d.project.completedAt)})[d.project.status]}</dd></div><div><dt>Projektstart</dt><dd>${dk(d.project.start)}</dd></div><div><dt>Lokation</dt><dd>${esc(d.project.address)}</dd></div></dl>
  <h2>2. Synlig leverandørkæde og relationernes status i perioden</h2>${d.hidden?`<p class="sub">🔒 Kæden indeholder ${d.hidden} mellemled, hvis identitet ikke er synlig for ${esc(r.forName)}. Deres navn, CVR og registerstatus indgår ikke i rapporten.</p>`:""}<div class="tw"><table><tr><th>Opdragsgiver</th><th>Underleverandør</th><th>Status i perioden</th><th>Bemærkning</th></tr>${d.links.map(l=>`<tr><td>${esc(l.up)}</td><td><b>${esc(l.down)}</b></td><td>${relP(l)}</td><td class="sub">${esc(l.periodText)}</td></tr>`).join("")||`<tr><td colspan="4" class="sub">Ingen relationer i kæden.</td></tr>`}</table></div>
  <h2>3. Virksomheder — historiske registerkontroller og dokumentation</h2>${d.companies.length?"":`<p class="sub">Ingen virksomheder med synlige detaljer for ${esc(r.forName)} i dette projekt.</p>`}${d.companies.map(c=>`<div class="card" style="box-shadow:none"><h2>${esc(c.name)} <span class="sub">CVR ${c.cvr}</span></h2>
    <h3>Daglig selskabsstatuskontrol i perioden</h3><p class="sub">${c.daily.n?`${c.daily.n} kontrol(ler) fra ${dts(c.daily.first)} til ${dts(c.daily.last)}${c.daily.fail?` · ${c.daily.fail} kunne ikke kontrolleres (registret svarede ikke)`:""}.`:"Ingen daglige kontroller registreret i perioden."}</p>
    <h3>Registersnapshots — status på kontroltidspunktet</h3><div class="tw"><table><tr><th>Tidspunkt</th><th>Type</th><th>Selskabsstatus</th><th>Moms</th><th>Arbejdsgiver</th></tr>${c.snaps.map(s=>`<tr><td>${dts(s.t)}</td><td>${SN[s.type]}${s.ym?" ("+ymLabel(s.ym)+")":""}</td><td>${stPill(s.status)}</td><td>${regPill(s.vat)}</td><td>${regPill(s.emp)}</td></tr>`).join("")||`<tr><td colspan="5" class="sub">Ingen snapshots i perioden.</td></tr>`}</table></div>
    <h3>Registrerede statusændringer i perioden</h3>${c.events.map(e=>`<div>${dts(e.t)} · ${KI[e.kind]}: <b>${esc(lab(e.prev))} → ${esc(lab(e.next))}</b> <span class="sub">(${e.by==="DAGLIG"?"daglig kontrol":e.by==="MÅNEDLIG"?"månedligt snapshot":"kontrol ved "+esc(e.by).toLowerCase()})</span></div>`).join("")||`<p class="sub">Ingen registrerede ændringer i perioden.</p>`}
    <h3>Månedlig eIndkomst — uploadet af virksomheden selv</h3>${c.docs.map(x=>`<div class="row" style="align-items:flex-start"><b style="min-width:140px">${ymLabel(x.ym)}</b> ${docPill(x.status)} <span class="sub">${x.versions.length?x.versions.map(y=>`v${y.no} · ${dts(y.at)} · ${esc(y.by)} · ${esc(y.file)}`).join("<br>"):"Ingen fil registreret · frist "+dk(x.due)}</span></div>`).join("")||`<p class="sub">Ingen dokumentationsperioder i rapportperioden.</p>`}<p class="sub">“Uploadet” betyder, at en fil er registreret på tidspunktet — ikke at indholdet er kontrolleret eller godkendt.</p>
    <h3>Registrerede medarbejdere — virksomhedens egen erklæring</h3>${c.emps.length?`<div class="tw"><table><tr><th>Medarbejder</th><th>Funktion</th><th>Periode på projektet</th><th>Registreret</th></tr>${c.emps.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.role||"–")}</td><td>${dk(e.start)} – ${empEndText(e)}${e.byRel?`<br><span class="sub">Registreret uden slutdato; virksomhedens deltagelse sluttede ${dk(e.end)}.</span>`:""}</td><td>${dts(e.t)}</td></tr>`).join("")}</table></div>`:`<p class="sub">Ingen medarbejdere registreret i perioden.</p>`}</div>`).join("")}
  <h2>4. Afsluttende snapshot</h2><p class="sub">${d.final?"Uforanderligt afsluttende snapshot oprettet "+dts(d.final)+".":"Projektet er ikke afsluttet — der findes endnu intet afsluttende snapshot."}</p>
  <h2>5. Historik — uddrag af audit trail (nyeste øverst)</h2>${d.audit.length?`<div class="tl">${d.audit.map(a=>`<div>${esc(a.text)}<time>${dts(a.t)}</time></div>`).join("")}</div>`:`<p class="sub">Ingen hændelser i perioden.</p>`}
  <p class="sub" style="margin-top:8px">Rapport v${r.no} genereret ${dts(r.t)}. Alle tidspunkter i rapporten ligger på eller før genereringstidspunktet.</p></div>`};

/* ---------------- Øvrige sider ---------------- */
VIEWS.companies=()=>{const cvr=myCvr();const m=new Map();myProjects(cvr).forEach(p=>{const v=vis(p,cvr);v.identity.forEach(c=>{if(c===cvr)return;const x=m.get(c)||{n:0,detail:false};x.n++;x.detail=x.detail||v.detail.has(c);m.set(c,x)})});return head("Virksomheder","Virksomheder I må se på jeres projekter. Samme CVR vises én gang. Skjulte mellemled findes ikke her — og kan ikke søges frem.")+`<div class="card flush"><div class="tw"><table><tr><th>Virksomhed</th><th>Selskabsstatus (dagligt)</th><th>Moms / arbejdsgiver (månedligt)</th><th>Projekter</th></tr>${[...m].map(([c,x])=>`<tr><td><b>${esc(co(c).name)}</b><small>CVR ${c}</small></td><td>${x.detail?stPill(co(c).cur):`<span class="sub">Vises ikke for opstrøms led</span>`}</td><td>${x.detail?regPill(co(c).vat)+" "+regPill(co(c).emp):""}</td><td>${x.n}</td></tr>`).join("")||`<tr><td colspan="4" class="sub">Ingen virksomheder endnu.</td></tr>`}</table></div></div>`};

  <div class="card flush"><div class="ch"><h2>Månedligt snapshot</h2><p class="sub">Selskabsstatus + momsregistrering + arbejdsgiverregistrering. Historisk og uforanderligt. eIndkomst vises særskilt.</p></div>${det.size?`<div class="tw"><table><tr><th>Virksomhed</th><th>Måned</th><th>Selskabsstatus</th><th>Moms</th><th>Arbejdsgiver</th></tr>${[...det].map(c=>{const s=last(c);return s?`<tr><td><b>${esc(co(c).name)}</b></td><td>${ymLabel(s.ym)}${s.backdated?` <span class="pill">efterbehandlet ${dk(s.t.slice(0,10))}</span>`:""}</td><td>${stPill(s.status)}</td><td>${regPill(s.vat)}</td><td>${regPill(s.emp)}</td></tr>`:`<tr><td><b>${esc(co(c).name)}</b></td><td colspan="4" class="sub">Intet månedligt snapshot endnu — tages ved månedens udgang.</td></tr>`}).join("")}</table></div>`:`<div class="ch" style="border-top:1px solid var(--line)"><p class="sub">Ingen virksomheder endnu — månedlige snapshots vises her, når jeres underleverandører er aktive på et projekt.</p></div>`}</div>
  <div class="card"><h2>Registrerede ændringer</h2><p class="sub">Hver ændring er en selvstændig historisk hændelse — også når status går tilbage til NORMAL.</p>${evs.map(e=>`<div>${dts(e.t)} · <b>${esc(co(e.cvr).name)}</b> · ${esc(lab(e.prev))} → ${esc(lab(e.next))}</div>`).join("")||`<p class="sub">Ingen ændringer.</p>`}</div>`};

VIEWS.simulator=()=>{const mon=new Set(monitored());

    <td><label class="row" style="gap:6px"><input type="checkbox" id="g-v-${c}" data-reg="${c}" data-f="vat" ${g.vat?"checked":""} style="width:18px" aria-label="Momsregistreret">${regPill(g.vat?"REGISTERED":"NOT_REGISTERED")}</label></td>
    <td><label class="row" style="gap:6px"><input type="checkbox" id="g-e-${c}" data-reg="${c}" data-f="emp" ${g.emp?"checked":""} style="width:18px" aria-label="Arbejdsgiverregistreret">${regPill(g.emp?"REGISTERED":"NOT_REGISTERED")}</label>${pendingMonthly?`<small>${pill("a","⏳ Slår først igennem ved næste månedlige snapshot")}</small>`:""}</td></tr>`}).join("");
  return head("Register og jobs","Simulér ændringer i det offentlige register, og kør de samme jobs som i produktion. INTEGRATION_TBD: endelig registerudbyder er ikke valgt.")
  +`<div class="card"><h2>Sådan hænger det sammen</h2><p class="sub"><b>1.</b> Et valg i tabellen ændrer <b>kun det simulerede register</b> (svarer til, at CVR/Skat ændrer data). <b>2.</b> Kundernes visning opdateres først, når et job kører: <b>Daglig selskabsstatus</b> læser kun selskabsstatus · <b>Månedligt snapshot</b> læser status + moms + arbejdsgiver og fryses som historik · <b>eIndkomst-perioder</b> opretter dokumentationsperioder for afsluttede måneder. Tidligere snapshots ændres aldrig.</p><div class="row"><button class="pri" data-act="job" data-job="daily">▶ Kør daglig selskabsstatus</button><button data-act="job" data-job="docs">▶ Kør eIndkomst-perioder</button></div>
  ${(()=>{const def=monthlyDefault();const cur=ym(S.today);const opts=[];let k=cur;for(let i=0;i<6;i++){opts.unshift(k);k=prevYm(k)}const done=k=>{const first=k+"-01",last=lastDayOf(first);const m=[...new Set(S.rels.filter(r=>r.acceptedAt&&r.status!=="CANCELLED"&&r.acceptedAt.slice(0,10)<=last&&(!r.end||r.end>=first)).map(r=>r.down))];const d=m.filter(c=>S.snaps.some(x=>x.cvr===c&&x.type==="MONTHLY"&&x.ym===k&&x.status!=="COULD_NOT_CHECK")).length;return[d,m.length]};
    return`<div class="card" style="background:var(--soft);box-shadow:none"><h3>Månedligt snapshot — vælg måned</h3><div class="row"><select id="m-ym" style="width:auto">${opts.map(k=>{const[d,m]=done(k);const allowed=monthlyAllowed(k);return`<option value="${k}" ${k===def?"selected":""} ${allowed?"":"disabled"}>${ymLabel(k)}${allowed?(m===0?" — ingen relationer i måneden (kan ikke behandles)":d?` — slutbehandlet (${d}/${m})`:` — ikke slutbehandlet (${m} virksomhed(er) med relation)`):" — ikke afsluttet endnu"}</option>`}).join("")}</select><button data-act="job" data-job="monthly">▶ Kør månedligt snapshot for valgt måned</button></div><p class="sub">Demodato ${dk(S.today)}: standard er <b>${ymLabel(def)}</b>${monthlyAllowed(cur)?"":" — "+ymLabel(cur)+" kan først slutbehandles den "+dk(lastDayOf(S.today))}. <b>Regel ved gentagen kørsel:</b> ét gyldigt snapshot pr. virksomhed pr. måned. Findes det, bevares det uændret (ingen ny version); kun virksomheder uden gyldigt snapshot behandles. <b>Bagudrettet kørsel:</b> kræver en relation, der var gældende i måneden, og registerobservationer fra selve måneden — ellers afvises perioden. Et efterbehandlet ældre snapshot markeres og fortrænger aldrig nyere måneder i kundernes visning.</p></div>`})()}<h3>Seneste jobkørsler</h3>${S.jobs.slice(0,6).map(j=>`<small class="sub">${dts(j.t)} · ${esc(j.job)} · ${esc(j.res)}</small>`).join("")||`<small class="sub">Ingen jobs kørt endnu.</small>`}</div>
  <div class="card flush"><div class="ch"><h2>Simuleret register</h2><p class="sub">Den aktuelle registerværdi vises som status-mærke; vælg en ny værdi i feltet nedenunder. ⏳ betyder, at registret er ændret, men at et job endnu ikke har opdateret kundernes visning.</p></div><div class="tw"><table><tr><th>Virksomhed</th><th>Selskabsstatus (daglig kontrol)</th><th>Moms (månedligt)</th><th>Arbejdsgiver (månedligt)</th></tr>${rows}</table></div></div>

  ${open&&l&&l.own&&l.status==="ACTIVE"?`<h3>Afslut underleverandør på projekt</h3><p class="sub">En accepteret relation slettes aldrig. Den afsluttes med en slutdato — historikken bevares.</p><div class="f"><label for="end-date">Slutdato</label><input id="end-date" type="date" value="${S.today}"></div><div><button class="dan" data-act="endrel" data-id="${relId}">Afslut underleverandør</button></div>`:""}
